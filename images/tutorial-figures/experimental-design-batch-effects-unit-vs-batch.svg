<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">Experimental Units vs. Batch Allocation</title>
  <desc id="svg-desc">Two-panel diagram comparing pseudoreplication against independent biological replicates in Panel A, and comparing confounded, hidden-covariate, and balanced batch allocations in Panel B.</desc>
  <defs>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="440" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="30" y="38" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#0F172A">Experimental Units vs. Batch Allocation</text>
  <text x="30" y="59" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#475569">Count biological replicates at the independently assigned unit, and cross conditions and covariates across batches.</text>

  <!-- Panel A -->
  <rect x="28" y="78" width="438" height="338" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <path d="M 28 88 Q 28 78 38 78 L 456 78 Q 466 78 466 88 L 466 112 L 28 112 Z" fill="#17324F"/>
  <text x="42" y="100" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">A. Experimental Unit vs. Technical Replicates</text>

  <!-- Panel A: Wrong (Pseudoreplication) -->
  <rect x="42" y="126" width="410" height="130" rx="8" fill="#FEF2F2" stroke="#FECACA" stroke-width="1.2"/>
  <text x="54" y="146" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#991B1B">Pitfall: 1 donor, 3 libraries (n = 1, NOT n = 3)</text>

  <rect x="56" y="176" width="88" height="40" rx="6" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/>
  <text x="100" y="194" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#7F1D1D">Donor01</text>
  <text x="100" y="209" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="10" fill="#991B1B">(1 unit)</text>

  <line x1="146" y1="186" x2="184" y2="169" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow-slate)"/>
  <line x1="146" y1="196" x2="184" y2="196" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow-slate)"/>
  <line x1="146" y1="206" x2="184" y2="223" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow-slate)"/>

  <rect x="190" y="158" width="84" height="22" rx="4" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1.2"/>
  <text x="232" y="173" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#1E293B">L01 (lane 1)</text>
  <rect x="190" y="185" width="84" height="22" rx="4" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1.2"/>
  <text x="232" y="200" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#1E293B">L02 (lane 2)</text>
  <rect x="190" y="212" width="84" height="22" rx="4" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1.2"/>
  <text x="232" y="227" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#1E293B">L03 (lane 3)</text>

  <text x="290" y="180" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#7F1D1D">Technical replicates</text>
  <text x="290" y="196" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="10.5" fill="#475569">Share the same donor.</text>
  <text x="290" y="212" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="10.5" fill="#475569">Treating as n = 3 causes</text>
  <text x="290" y="227" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="10.5" fill="#475569">pseudoreplication.</text>

  <!-- Panel A: Right (Independent Biological Units) -->
  <rect x="42" y="268" width="410" height="134" rx="8" fill="#F0FDFA" stroke="#99F6E4" stroke-width="1.2"/>
  <text x="54" y="288" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#115E59">Valid: 3 independent donors (true n = 3)</text>

  <rect x="56" y="300" width="88" height="24" rx="5" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.3"/>
  <text x="100" y="316" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#134E4A">Donor01</text>
  <rect x="56" y="331" width="88" height="24" rx="5" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.3"/>
  <text x="100" y="347" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#134E4A">Donor02</text>
  <rect x="56" y="362" width="88" height="24" rx="5" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.3"/>
  <text x="100" y="378" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#134E4A">Donor03</text>

  <line x1="146" y1="312" x2="184" y2="312" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow-slate)"/>
  <line x1="146" y1="343" x2="184" y2="343" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow-slate)"/>
  <line x1="146" y1="374" x2="184" y2="374" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow-slate)"/>

  <rect x="190" y="300" width="84" height="24" rx="4" fill="#FFFFFF" stroke="#5EEAD4" stroke-width="1.2"/>
  <text x="232" y="316" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#1E293B">S01 / L01</text>
  <rect x="190" y="331" width="84" height="24" rx="4" fill="#FFFFFF" stroke="#5EEAD4" stroke-width="1.2"/>
  <text x="232" y="347" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#1E293B">S02 / L02</text>
  <rect x="190" y="362" width="84" height="24" rx="4" fill="#FFFFFF" stroke="#5EEAD4" stroke-width="1.2"/>
  <text x="232" y="378" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#1E293B">S03 / L03</text>

  <text x="290" y="324" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#115E59">Independent units</text>
  <text x="290" y="341" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="10.5" fill="#475569">Each unit receives</text>
  <text x="290" y="357" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="10.5" fill="#475569">treatment independently;</text>
  <text x="290" y="373" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="10.5" fill="#475569">true variance is captured.</text>

  <!-- Panel B -->
  <rect x="484" y="78" width="448" height="338" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <path d="M 484 88 Q 484 78 494 78 L 922 78 Q 932 78 932 88 L 932 112 L 484 112 Z" fill="#17324F"/>
  <text x="498" y="100" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">B. Batch Allocation and Covariate Balance</text>

  <!-- Row 1: Confounded -->
  <rect x="498" y="126" width="420" height="82" rx="8" fill="#FEF2F2" stroke="#FECACA" stroke-width="1.2"/>
  <text x="510" y="145" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#991B1B">1. Perfectly Confounded (Inseparable)</text>
  <rect x="510" y="155" width="186" height="26" rx="5" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="518" y="172" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#334155">Batch 1:</text>
  <rect x="572" y="159" width="36" height="18" rx="3" fill="#DBEAFE" stroke="#2563EB"/>
  <text x="590" y="172" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#1E40AF">Ctrl</text>
  <rect x="613" y="159" width="36" height="18" rx="3" fill="#DBEAFE" stroke="#2563EB"/>
  <text x="631" y="172" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#1E40AF">Ctrl</text>
  <rect x="654" y="159" width="36" height="18" rx="3" fill="#DBEAFE" stroke="#2563EB"/>
  <text x="672" y="172" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#1E40AF">Ctrl</text>

  <rect x="712" y="155" width="194" height="26" rx="5" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="720" y="172" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#334155">Batch 2:</text>
  <rect x="774" y="159" width="38" height="18" rx="3" fill="#FEE2E2" stroke="#DC2626"/>
  <text x="793" y="172" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#991B1B">Trt</text>
  <rect x="817" y="159" width="38" height="18" rx="3" fill="#FEE2E2" stroke="#DC2626"/>
  <text x="836" y="172" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#991B1B">Trt</text>
  <rect x="860" y="159" width="38" height="18" rx="3" fill="#FEE2E2" stroke="#DC2626"/>
  <text x="879" y="172" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#991B1B">Trt</text>
  <text x="510" y="198" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="10.5" fill="#7F1D1D">Model ~ batch + condition is rank-deficient; batch and biology are identical.</text>

  <!-- Row 2: Hidden Covariate -->
  <rect x="498" y="220" width="420" height="86" rx="8" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.2"/>
  <text x="510" y="239" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#92400E">2. Condition Balanced, Covariate Confounded</text>
  <rect x="510" y="249" width="186" height="26" rx="5" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="518" y="266" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#334155">Lane 1:</text>
  <rect x="572" y="253" width="54" height="18" rx="3" fill="#DBEAFE" stroke="#2563EB"/>
  <text x="599" y="266" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#1E40AF">Ctrl (F)</text>
  <rect x="632" y="253" width="54" height="18" rx="3" fill="#FEE2E2" stroke="#DC2626"/>
  <text x="659" y="266" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#991B1B">Trt (F)</text>

  <rect x="712" y="249" width="194" height="26" rx="5" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="720" y="266" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#334155">Lane 2:</text>
  <rect x="774" y="253" width="56" height="18" rx="3" fill="#DBEAFE" stroke="#2563EB"/>
  <text x="802" y="266" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#1E40AF">Ctrl (M)</text>
  <rect x="836" y="253" width="56" height="18" rx="3" fill="#FEE2E2" stroke="#DC2626"/>
  <text x="864" y="266" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#991B1B">Trt (M)</text>
  <text x="510" y="294" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="10.5" fill="#78350F">Condition crosses lanes, but sex is 100% collinear with lane (~ batch + sex fails).</text>

  <!-- Row 3: Crossed and Balanced -->
  <rect x="498" y="318" width="420" height="84" rx="8" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1.2"/>
  <text x="510" y="337" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#166534">3. Crossed and Covariate-Balanced (Separable)</text>
  <rect x="510" y="347" width="190" height="26" rx="5" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="518" y="364" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#334155">Batch 1:</text>
  <rect x="572" y="351" width="58" height="18" rx="3" fill="#DBEAFE" stroke="#2563EB"/>
  <text x="601" y="364" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#1E40AF">Ctrl F/M</text>
  <rect x="634" y="351" width="58" height="18" rx="3" fill="#FEE2E2" stroke="#DC2626"/>
  <text x="663" y="364" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#991B1B">Trt F/M</text>

  <rect x="712" y="347" width="194" height="26" rx="5" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="720" y="364" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#334155">Batch 2:</text>
  <rect x="774" y="351" width="58" height="18" rx="3" fill="#DBEAFE" stroke="#2563EB"/>
  <text x="803" y="364" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#1E40AF">Ctrl F/M</text>
  <rect x="838" y="351" width="58" height="18" rx="3" fill="#FEE2E2" stroke="#DC2626"/>
  <text x="867" y="364" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#991B1B">Trt F/M</text>
  <text x="510" y="391" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="10.5" fill="#14532D">Full rank: batch, sex, and condition effects can all be estimated cleanly.</text>
</svg>