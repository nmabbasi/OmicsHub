<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" width="960" height="390" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">Batch Alignment vs. Overcorrection in scRNA-seq Integration</title>
  <desc id="svg-desc">Three-panel diagram comparing unintegrated PCA where batches separate, balanced integration where shared cell types align and batch-unique plasmacytoid dendritic cells remain distinct, and overcorrection where batch-unique cells are pulled into an unrelated cluster.</desc>

  <!-- Outer card -->
  <rect x="0" y="0" width="960" height="390" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="28" y="34" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0F172A">What Integration Should Do vs. Overcorrection</text>
  <text x="28" y="54" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#475569">Align shared populations across batches while keeping batch-unique states (like v2-A-only pDCs) separate.</text>

  <!-- Legend row -->
  <circle cx="38" cy="74" r="5" fill="#2563EB"/>
  <text x="48" y="78" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#1E293B">Batch 1: 10x v2 A</text>
  <polygon points="180,68 186,79 174,79" fill="#D97706"/>
  <text x="192" y="78" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#1E293B">Batch 2: 10x v3</text>
  <circle cx="322" cy="74" r="5.5" fill="#0D9488" stroke="#134E4A" stroke-width="1.5"/>
  <text x="334" y="78" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#134E4A">Batch-unique subset: pDC (v2 A only, n = 26)</text>

  <!-- Panel A: Unintegrated PCA -->
  <rect x="24" y="92" width="292" height="276" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <path d="M 24 102 Q 24 92 34 92 L 306 92 Q 316 92 316 102 L 316 124 L 24 124 Z" fill="#1E3A5F"/>
  <text x="36" y="113" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#FFFFFF">A. Unintegrated PCA (Baseline)</text>

  <!-- Panel A plot box -->
  <rect x="38" y="136" width="264" height="170" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <!-- B cell v2 A -->
  <ellipse cx="86" cy="174" rx="28" ry="19" fill="#DBEAFE" stroke="#93C5FD" stroke-dasharray="3,2"/>
  <circle cx="76" cy="171" r="4" fill="#2563EB"/><circle cx="88" cy="167" r="4" fill="#2563EB"/><circle cx="96" cy="177" r="4" fill="#2563EB"/><circle cx="81" cy="182" r="4" fill="#2563EB"/>
  <text x="86" y="151" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#1E40AF">B cell (v2 A)</text>
  <!-- B cell v3 -->
  <ellipse cx="146" cy="212" rx="28" ry="19" fill="#FEF3C7" stroke="#FCD34D" stroke-dasharray="3,2"/>
  <polygon points="138,205 143,214 133,214" fill="#D97706"/><polygon points="151,203 156,212 146,212" fill="#D97706"/><polygon points="146,215 151,224 141,224" fill="#D97706"/><polygon points="158,213 163,222 153,222" fill="#D97706"/>
  <text x="146" y="242" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#92400E">B cell (v3)</text>
  <!-- Monocyte v2 A -->
  <ellipse cx="222" cy="170" rx="28" ry="18" fill="#DBEAFE" stroke="#93C5FD" stroke-dasharray="3,2"/>
  <circle cx="212" cy="168" r="4" fill="#2563EB"/><circle cx="224" cy="165" r="4" fill="#2563EB"/><circle cx="232" cy="174" r="4" fill="#2563EB"/><circle cx="219" cy="177" r="4" fill="#2563EB"/>
  <text x="222" y="148" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#1E40AF">Monocyte (v2 A)</text>
  <!-- Monocyte v3 -->
  <ellipse cx="256" cy="222" rx="28" ry="18" fill="#FEF3C7" stroke="#FCD34D" stroke-dasharray="3,2"/>
  <polygon points="248,215 253,224 243,224" fill="#D97706"/><polygon points="260,213 265,222 255,222" fill="#D97706"/><polygon points="256,224 261,233 251,233" fill="#D97706"/><polygon points="267,221 272,230 262,230" fill="#D97706"/>
  <text x="256" y="252" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#92400E">Monocyte (v3)</text>
  <!-- pDC isolated -->
  <ellipse cx="82" cy="272" rx="25" ry="15" fill="#CCFBF1" stroke="#5EEAD4"/>
  <circle cx="74" cy="271" r="4" fill="#0D9488" stroke="#134E4A" stroke-width="1.2"/><circle cx="84" cy="268" r="4" fill="#0D9488" stroke="#134E4A" stroke-width="1.2"/><circle cx="91" cy="275" r="4" fill="#0D9488" stroke="#134E4A" stroke-width="1.2"/>
  <text x="150" y="276" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#134E4A">pDC (v2 A only)</text>

  <!-- Panel A footer -->
  <text x="38" y="325" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#334155">Same cell types split by batch.</text>
  <text x="38" y="343" font-family="monospace" font-size="10.5" fill="#475569">Batch iLISI ~ 1.07</text>
  <text x="38" y="358" font-family="monospace" font-size="10.5" fill="#475569">Label cLISI ~ 1.02</text>

  <!-- Panel B: Balanced Integration -->
  <rect x="334" y="92" width="292" height="276" rx="10" fill="#FFFFFF" stroke="#99F6E4" stroke-width="1.5"/>
  <path d="M 334 102 Q 334 92 344 92 L 616 92 Q 626 92 626 102 L 626 124 L 334 124 Z" fill="#0F766E"/>
  <text x="346" y="113" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#FFFFFF">B. Balanced Alignment (Target)</text>

  <!-- Panel B plot box -->
  <rect x="348" y="136" width="264" height="170" rx="6" fill="#F0FDFA" stroke="#CCFBF1" stroke-width="1"/>
  <!-- Aligned B cells -->
  <ellipse cx="422" cy="186" rx="34" ry="22" fill="#FFFFFF" stroke="#64748B" stroke-dasharray="3,2"/>
  <circle cx="408" cy="181" r="4" fill="#2563EB"/><polygon points="421,175 426,184 416,184" fill="#D97706"/>
  <circle cx="432" cy="183" r="4" fill="#2563EB"/><polygon points="413,189 418,198 408,198" fill="#D97706"/>
  <circle cx="425" cy="195" r="4" fill="#2563EB"/><polygon points="436,189 441,198 431,198" fill="#D97706"/>
  <text x="422" y="157" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#1E293B">Aligned B cells</text>

  <!-- Aligned Monocytes -->
  <ellipse cx="546" cy="190" rx="34" ry="22" fill="#FFFFFF" stroke="#64748B" stroke-dasharray="3,2"/>
  <circle cx="533" cy="184" r="4" fill="#2563EB"/><polygon points="545,179 550,188 540,188" fill="#D97706"/>
  <circle cx="556" cy="187" r="4" fill="#2563EB"/><polygon points="537,193 542,202 532,202" fill="#D97706"/>
  <circle cx="548" cy="198" r="4" fill="#2563EB"/><polygon points="560,192 565,201 555,201" fill="#D97706"/>
  <text x="546" y="161" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#1E293B">Aligned Monocytes</text>

  <!-- pDC preserved -->
  <ellipse cx="422" cy="270" rx="27" ry="16" fill="#CCFBF1" stroke="#0F766E" stroke-width="1.3"/>
  <circle cx="414" cy="269" r="4" fill="#0D9488" stroke="#134E4A" stroke-width="1.2"/><circle cx="424" cy="266" r="4" fill="#0D9488" stroke="#134E4A" stroke-width="1.2"/><circle cx="431" cy="273" r="4" fill="#0D9488" stroke="#134E4A" stroke-width="1.2"/>
  <text x="458" y="274" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#134E4A">pDC stays distinct</text>

  <!-- Panel B footer -->
  <text x="348" y="325" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#0F766E">Shared types mix; unique subset preserved.</text>
  <text x="348" y="343" font-family="monospace" font-size="10.5" fill="#134E4A">Shared iLISI -&gt; 1.9+</text>
  <text x="348" y="358" font-family="monospace" font-size="10.5" fill="#134E4A">pDC cLISI stays near 1.0</text>

  <!-- Panel C: Overcorrection -->
  <rect x="644" y="92" width="292" height="276" rx="10" fill="#FFFFFF" stroke="#FECACA" stroke-width="1.5"/>
  <path d="M 644 102 Q 644 92 654 92 L 926 92 Q 936 92 936 102 L 936 124 L 644 124 Z" fill="#991B1B"/>
  <text x="656" y="113" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#FFFFFF">C. Overcorrection Risk (Watch pDCs)</text>

  <!-- Panel C plot box -->
  <rect x="658" y="136" width="264" height="170" rx="6" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
  <!-- Mixed B cells + pulled pDC -->
  <ellipse cx="748" cy="204" rx="44" ry="30" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.4" stroke-dasharray="4,2"/>
  <circle cx="728" cy="193" r="4" fill="#2563EB"/><polygon points="742,188 747,197 737,197" fill="#D97706"/>
  <circle cx="755" cy="194" r="4" fill="#2563EB"/><polygon points="733,205 738,214 728,214" fill="#D97706"/>
  <circle cx="764" cy="207" r="4" fill="#2563EB"/><polygon points="773,197 778,206 768,206" fill="#D97706"/>
  <!-- pDC pulled in -->
  <circle cx="745" cy="218" r="4.3" fill="#0D9488" stroke="#134E4A" stroke-width="1.2"/>
  <circle cx="757" cy="221" r="4.3" fill="#0D9488" stroke="#134E4A" stroke-width="1.2"/>
  <circle cx="769" cy="218" r="4.3" fill="#0D9488" stroke="#134E4A" stroke-width="1.2"/>

  <!-- Arrow showing pull from bottom -->
  <path d="M 730 272 Q 748 256 753 233" fill="none" stroke="#DC2626" stroke-width="1.6" stroke-dasharray="3,2"/>
  <polygon points="754,228 748,236 757,237" fill="#DC2626"/>
  <text x="720" y="287" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#991B1B">v2-A pDC pulled</text>
  <text x="720" y="299" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#991B1B">toward unrelated v3 cells</text>
  <text x="748" y="167" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#991B1B">Merged neighbors</text>

  <!-- Monocytes -->
  <ellipse cx="860" cy="190" rx="32" ry="21" fill="#FFFFFF" stroke="#64748B" stroke-dasharray="3,2"/>
  <circle cx="848" cy="184" r="4" fill="#2563EB"/><polygon points="860,179 865,188 855,188" fill="#D97706"/>
  <circle cx="870" cy="187" r="4" fill="#2563EB"/><polygon points="852,193 857,202 847,202" fill="#D97706"/>
  <circle cx="863" cy="198" r="4" fill="#2563EB"/><polygon points="873,192 878,201 868,201" fill="#D97706"/>
  <text x="860" y="161" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#1E293B">Monocytes</text>

  <!-- Panel C footer -->
  <text x="658" y="325" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#991B1B">Observed in PBMC pDCs (n = 26):</text>
  <text x="658" y="343" font-family="monospace" font-size="10.5" fill="#7F1D1D">iLISI: 1.261 -&gt; 1.366</text>
  <text x="658" y="358" font-family="monospace" font-size="10.5" fill="#7F1D1D">cLISI: 1.360 -&gt; 1.529 (worse)</text>
</svg>
