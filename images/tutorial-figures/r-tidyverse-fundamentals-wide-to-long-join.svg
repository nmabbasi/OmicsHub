<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">Reshaping a wide gene-count matrix into a tidy table and joining sample metadata</title>
  <desc id="svg-desc">Diagram showing wide gene_counts.tsv (3 genes by 3 samples) and samples.tsv metadata transformed by pivot_longer() and left_join(..., relationship = "many-to-one") into a 9-row tidy table, then summarized by group_by() and summarise() into per-sample QC totals.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0D9488"/>
    </marker>
    <filter id="card-shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="960" height="460" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="32" y="40" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#0F172A">From Wide Count Matrix to Tidy QC Summary</text>
  <text x="32" y="64" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#475569">Reshape sample columns into rows with pivot_longer(), validate metadata cardinality with left_join(), then summarise per sample</text>

  <!-- Card 1: Wide gene_counts.tsv + samples.tsv -->
  <g filter="url(#card-shadow)">
    <rect x="32" y="92" width="248" height="196" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
    <path d="M 32 102 Q 32 92 42 92 L 270 92 Q 280 92 280 102 L 280 126 L 32 126 Z" fill="#334155"/>
    <text x="46" y="114" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">1. Wide gene_counts.tsv</text>
    <text x="268" y="114" text-anchor="end" font-family="monospace" font-size="11" font-weight="700" fill="#E2E8F0">3x3</text>
    <text x="46" y="152" font-family="monospace" font-size="12" font-weight="700" fill="#0F172A">gene   S01  S02  S03</text>
    <line x1="46" y1="160" x2="266" y2="160" stroke="#E2E8F0" stroke-width="1"/>
    <text x="46" y="182" font-family="monospace" font-size="12" fill="#334155">TP53   150  175  160</text>
    <text x="46" y="206" font-family="monospace" font-size="12" fill="#334155">BRCA1  320  280  305</text>
    <text x="46" y="230" font-family="monospace" font-size="12" fill="#334155">MYC    890  920  900</text>
    <text x="46" y="266" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#475569">Compact matrix: sample IDs in headers</text>
  </g>

  <g filter="url(#card-shadow)">
    <rect x="32" y="306" width="248" height="128" rx="10" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.6"/>
    <path d="M 32 316 Q 32 306 42 306 L 270 306 Q 280 306 280 316 L 280 340 L 32 340 Z" fill="#1D4ED8"/>
    <text x="46" y="328" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">samples.tsv (metadata)</text>
    <text x="268" y="328" text-anchor="end" font-family="monospace" font-size="11" font-weight="700" fill="#DBEAFE">1 row/ID</text>
    <text x="46" y="364" font-family="monospace" font-size="12" font-weight="700" fill="#0F172A">sample_id  condition</text>
    <text x="46" y="386" font-family="monospace" font-size="12" fill="#334155">S01        control</text>
    <text x="46" y="405" font-family="monospace" font-size="12" fill="#334155">S02        treated</text>
    <text x="46" y="424" font-family="monospace" font-size="12" fill="#334155">S03        treated</text>
  </g>

  <!-- Arrows 1 -> 2 -->
  <line x1="280" y1="190" x2="334" y2="190" stroke="#2563EB" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <text x="307" y="176" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#1D4ED8">pivot</text>
  <line x1="280" y1="364" x2="334" y2="290" stroke="#2563EB" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <text x="304" y="346" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#1D4ED8">join</text>

  <!-- Card 2: Tidy long + many-to-one join -->
  <g filter="url(#card-shadow)">
    <rect x="340" y="92" width="296" height="342" rx="10" fill="#FFFFFF" stroke="#5EEAD4" stroke-width="1.6"/>
    <path d="M 340 102 Q 340 92 350 92 L 626 92 Q 636 92 636 102 L 636 126 L 340 126 Z" fill="#0D9488"/>
    <text x="354" y="114" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">2. Tidy long + joined table</text>
    <text x="624" y="114" text-anchor="end" font-family="monospace" font-size="11" font-weight="700" fill="#CCFBF1">9 rows</text>

    <rect x="354" y="138" width="268" height="44" rx="6" fill="#F0FDFA" stroke="#99F6E4" stroke-width="1"/>
    <text x="364" y="156" font-family="monospace" font-size="9.5" font-weight="700" fill="#115E59">pivot_longer(all_of(count_samples))</text>
    <text x="364" y="174" font-family="monospace" font-size="9.5" font-weight="700" fill="#115E59">left_join(..., relationship="many-to-one")</text>

    <text x="354" y="208" font-family="monospace" font-size="11" font-weight="700" fill="#0F172A">gene   sample_id  raw_count  condition</text>
    <line x1="354" y1="216" x2="622" y2="216" stroke="#E2E8F0" stroke-width="1"/>
    <text x="354" y="236" font-family="monospace" font-size="11" fill="#334155">TP53   S01              150  control</text>
    <text x="354" y="256" font-family="monospace" font-size="11" fill="#334155">TP53   S02              175  treated</text>
    <text x="354" y="276" font-family="monospace" font-size="11" fill="#334155">TP53   S03              160  treated</text>
    <text x="354" y="296" font-family="monospace" font-size="11" fill="#334155">BRCA1  S01              320  control</text>
    <text x="354" y="316" font-family="monospace" font-size="11" fill="#64748B">...    ...              ...  ...</text>
    <text x="354" y="336" font-family="monospace" font-size="11" fill="#334155">MYC    S03              900  treated</text>

    <rect x="354" y="356" width="268" height="62" rx="6" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
    <text x="364" y="376" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#991B1B">Cardinality safeguard</text>
    <text x="364" y="394" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#7F1D1D">Duplicate sample_id in samples.tsv</text>
    <text x="364" y="410" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#7F1D1D">stops the join instead of doubling counts.</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="636" y1="242" x2="688" y2="242" stroke="#0D9488" stroke-width="2.2" marker-end="url(#arrow-teal)"/>
  <text x="662" y="226" text-anchor="middle" font-family="monospace" font-size="10.5" font-weight="700" fill="#0F766E">group</text>

  <!-- Card 3: sample_qc -->
  <g filter="url(#card-shadow)">
    <rect x="694" y="92" width="234" height="342" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
    <path d="M 694 102 Q 694 92 704 92 L 918 92 Q 928 92 928 102 L 928 126 L 694 126 Z" fill="#0F172A"/>
    <text x="708" y="114" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">3. sample_qc output</text>
    <text x="916" y="114" text-anchor="end" font-family="monospace" font-size="11" font-weight="700" fill="#E2E8F0">3 rows</text>

    <rect x="708" y="138" width="206" height="44" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
    <text x="718" y="156" font-family="monospace" font-size="10" font-weight="700" fill="#0F172A">group_by(sample_id, condition)</text>
    <text x="718" y="174" font-family="monospace" font-size="10" font-weight="700" fill="#0F172A">summarise(total, median)</text>

    <text x="708" y="208" font-family="monospace" font-size="11.5" font-weight="700" fill="#0F172A">id   cond     total  med</text>
    <line x1="708" y1="216" x2="914" y2="216" stroke="#E2E8F0" stroke-width="1"/>
    <text x="708" y="238" font-family="monospace" font-size="11.5" fill="#334155">S01  control  1360   320</text>
    <text x="708" y="260" font-family="monospace" font-size="11.5" fill="#334155">S02  treated  1375   280</text>
    <text x="708" y="282" font-family="monospace" font-size="11.5" fill="#334155">S03  treated  1365   305</text>

    <rect x="708" y="310" width="206" height="108" rx="6" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
    <text x="718" y="332" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#1E3A8A">Saved artifacts</text>
    <text x="718" y="354" font-family="monospace" font-size="11.5" fill="#1E40AF">results/sample_qc.tsv</text>
    <text x="718" y="374" font-family="monospace" font-size="11.5" fill="#1E40AF">results/reads_qc.png</text>
    <text x="718" y="398" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#334155">ggplot2 + ggsave(bg = "white")</text>
  </g>
</svg>
