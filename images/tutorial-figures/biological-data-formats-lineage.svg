<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" role="img" aria-label="Bioinformatics File Format Lineage &amp; Structural Checks">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
    <filter id="card-shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="960" height="460" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="36" y="42" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#0F172A">Bioinformatics File Format Lineage &amp; Structural Checks</text>
  <text x="36" y="66" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#475569">Trace how raw sequences, genome coordinates, alignments, variants, and expression matrices connect cleanly</text>
  <g filter="url(#card-shadow)">
    <rect x="36" y="98" width="204" height="178" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
    <path d="M 36 108 Q 36 98 46 98 L 230 98 Q 240 98 240 108 L 240 132 L 36 132 Z" fill="#0F172A"/>
    <text x="50" y="120" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#FFFFFF">1. Sequences</text>
    <text x="228" y="120" text-anchor="end" font-family="monospace" font-size="10.5" font-weight="700" fill="#E2E8F0">FASTA/Q</text>
    <text x="50" y="156" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#334155">FASTA: &gt;header + bases</text>
    <text x="50" y="178" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#334155">FASTQ: 4 lines per read</text>
    <text x="50" y="200" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#334155">Phred+33 ASCII scores</text>
    <text x="50" y="222" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#334155">Verify gzip -t &amp; seqkit</text>
  </g>
  <line x1="240" y1="187" x2="260" y2="187" stroke="#2563EB" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <g filter="url(#card-shadow)">
    <rect x="264" y="98" width="204" height="178" rx="10" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.6"/>
    <path d="M 264 108 Q 264 98 274 98 L 458 98 Q 468 98 468 108 L 468 132 L 264 132 Z" fill="#1D4ED8"/>
    <text x="278" y="120" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#FFFFFF">2. Coordinates</text>
    <text x="456" y="120" text-anchor="end" font-family="monospace" font-size="10.5" font-weight="700" fill="#E2E8F0">GTF/BED</text>
    <text x="278" y="156" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#1E3A8A">GTF/GFF: 1-based closed</text>
    <text x="278" y="178" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#1E3A8A">BED: 0-based half-open</text>
    <text x="278" y="200" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#1E3A8A">Contigs: chr1 vs 1</text>
    <text x="278" y="222" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#1E3A8A">Match build (GRCh38)</text>
  </g>
  <line x1="468" y1="187" x2="488" y2="187" stroke="#2563EB" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <g filter="url(#card-shadow)">
    <rect x="492" y="98" width="204" height="178" rx="10" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.6"/>
    <path d="M 492 108 Q 492 98 502 98 L 686 98 Q 696 98 696 108 L 696 132 L 492 132 Z" fill="#0D9488"/>
    <text x="506" y="120" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#FFFFFF">3. Alignments</text>
    <text x="684" y="120" text-anchor="end" font-family="monospace" font-size="10.5" font-weight="700" fill="#E2E8F0">SAM/BAM</text>
    <text x="506" y="156" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#134E4A">BAM: BGZF binary SAM</text>
    <text x="506" y="178" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#134E4A">Needs .bai / .csi index</text>
    <text x="506" y="200" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#134E4A">CIGAR &amp; MAPQ per read</text>
    <text x="506" y="222" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#134E4A">Check via quickcheck</text>
  </g>
  <line x1="696" y1="187" x2="716" y2="187" stroke="#2563EB" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <g filter="url(#card-shadow)">
    <rect x="720" y="98" width="204" height="178" rx="10" fill="#FAF5FF" stroke="#D8B4FE" stroke-width="1.6"/>
    <path d="M 720 108 Q 720 98 730 98 L 914 98 Q 924 98 924 108 L 924 132 L 720 132 Z" fill="#7C3AED"/>
    <text x="734" y="120" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#FFFFFF">4. Variants / MTX</text>
    <text x="912" y="120" text-anchor="end" font-family="monospace" font-size="10.5" font-weight="700" fill="#E2E8F0">VCF/MTX</text>
    <text x="734" y="156" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#4C1D95">VCF: normalized alleles</text>
    <text x="734" y="178" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#4C1D95">MTX: sparse 3-file set</text>
    <text x="734" y="200" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#4C1D95">barcodes/genes/mtx sync</text>
    <text x="734" y="222" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#4C1D95">Header &amp; dims verified</text>
  </g>
  <rect x="36" y="304" width="888" height="124" rx="10" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.5"/>
  <text x="56" y="332" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13.5" font-weight="700" fill="#92400E">Critical Coordinate &amp; Format Checks Before Running Downstream Tools</text>
  <text x="56" y="358" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#78350F">- Never mix 0-based half-open BED coordinates with 1-based inclusive GTF intervals or chr-prefixed vs unprefixed chromosomes.</text>
  <text x="56" y="382" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#78350F">- Structural checks (gzip -t, samtools quickcheck) prove file readability, not biological quality or library prep integrity.</text>
</svg>
