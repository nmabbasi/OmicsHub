<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-label="Slurm Batch Job Submission, Scheduling &amp; Monitoring Lifecycle">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
    <filter id="card-shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="960" height="440" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="36" y="42" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#0F172A">Slurm Batch Job Submission, Scheduling &amp; Monitoring Lifecycle</text>
  <text x="36" y="66" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#475569">From login-node submission script to compute-node execution, scratch I/O, and sacct post-mortem</text>
<g filter="url(#card-shadow)">
  <rect x="36" y="100" width="200" height="165" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
  <path d="M 36 110 Q 36 100 46 100 L 226 100 Q 236 100 236 110 L 236 134 L 36 134 Z" fill="#0F172A"/>
  <text x="50" y="122" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">1. Login Node</text>
  <text x="222" y="122" text-anchor="end" font-family="monospace" font-size="11" font-weight="700" fill="#E2E8F0">Submit</text>
  <text x="50" y="158" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" fill="#334155">Prepare .slurm batch script</text>
  <text x="50" y="180" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" fill="#334155">#SBATCH --cpus-per-task=8</text>
  <text x="50" y="202" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" fill="#334155">#SBATCH --mem=32G</text>
  <text x="50" y="224" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" fill="#334155">Run: sbatch run.slurm</text>
</g><line x1="236" y1="182" x2="272" y2="182" stroke="#2563EB" stroke-width="2.2" marker-end="url(#arrow-blue)"/><g filter="url(#card-shadow)">
  <rect x="276" y="100" width="200" height="165" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
  <path d="M 276 110 Q 276 100 286 100 L 466 100 Q 476 100 476 110 L 476 134 L 276 134 Z" fill="#1D4ED8"/>
  <text x="290" y="122" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">2. Scheduler Queue</text>
  <text x="462" y="122" text-anchor="end" font-family="monospace" font-size="11" font-weight="700" fill="#E2E8F0">Queue</text>
  <text x="290" y="158" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" fill="#334155">Slurm evaluates partition</text>
  <text x="290" y="180" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" fill="#334155">Priority + fairshare + limits</text>
  <text x="290" y="202" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" fill="#334155">State: PD (Pending)</text>
  <text x="290" y="224" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" fill="#334155">Track with: squeue --me</text>
</g><line x1="476" y1="182" x2="512" y2="182" stroke="#2563EB" stroke-width="2.2" marker-end="url(#arrow-blue)"/><g filter="url(#card-shadow)">
  <rect x="516" y="100" width="200" height="165" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
  <path d="M 516 110 Q 516 100 526 100 L 706 100 Q 716 100 716 110 L 716 134 L 516 134 Z" fill="#0D9488"/>
  <text x="530" y="122" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">3. Compute Node</text>
  <text x="702" y="122" text-anchor="end" font-family="monospace" font-size="11" font-weight="700" fill="#E2E8F0">Exec</text>
  <text x="530" y="158" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" fill="#334155">Load module / Micromamba</text>
  <text x="530" y="180" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" fill="#334155">Stage FASTQ to $TMPDIR</text>
  <text x="530" y="202" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" fill="#334155">State: R (Running)</text>
  <text x="530" y="224" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" fill="#334155">Write %x_%j.out &amp; .err</text>
</g><line x1="716" y1="182" x2="752" y2="182" stroke="#2563EB" stroke-width="2.2" marker-end="url(#arrow-blue)"/><g filter="url(#card-shadow)">
  <rect x="756" y="100" width="168" height="165" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
  <path d="M 756 110 Q 756 100 766 100 L 914 100 Q 924 100 924 110 L 924 134 L 756 134 Z" fill="#7C3AED"/>
  <text x="770" y="122" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">4. Accounting</text>
  <text x="910" y="122" text-anchor="end" font-family="monospace" font-size="11" font-weight="700" fill="#E2E8F0">Audit</text>
  <text x="770" y="158" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" fill="#334155">Verify State: COMPLETED</text>
  <text x="770" y="180" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" fill="#334155">Inspect MaxRSS vs Mem</text>
  <text x="770" y="202" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" fill="#334155">Handle OOM / TIMEOUT</text>
  <text x="770" y="224" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" fill="#334155">Check: sacct -j ID</text>
</g><rect x="36" y="300" width="888" height="106" rx="10" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1.4"/><text x="56" y="328" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#14532D">Job Arrays vs Sequential Steps (--array=1-N%4)</text><text x="56" y="354" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#166534">- Use job arrays with a sample sheet ($SLURM_ARRAY_TASK_ID) to run 10-500 samples in parallel under one job ID.</text><text x="56" y="378" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#166534">- Throttle concurrency with %max_jobs and stage intermediate files to fast node-local scratch before copying outputs back.</text>
</svg>
