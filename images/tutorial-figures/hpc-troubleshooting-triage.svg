<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" role="img" aria-label="Systematic Evidence-First Triage for Failed HPC Jobs">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
    <filter id="card-shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="960" height="460" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="36" y="42" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#0F172A">Systematic Evidence-First Triage for Failed HPC Jobs</text>
  <text x="36" y="66" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#475569">Diagnose Slurm exit codes, memory exhaustion (OOM), disk quota limits, and missing modules before opening a ticket</text>
  <g filter="url(#card-shadow)">
    <rect x="36" y="98" width="432" height="106" rx="10" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.6"/>
    <path d="M 36 108 Q 36 98 46 98 L 458 98 Q 468 98 468 108 L 468 132 L 36 132 Z" fill="#D97706"/>
    <text x="50" y="120" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#FFFFFF">A. Read Scheduler State (sacct)</text>
    <text x="456" y="120" text-anchor="end" font-family="monospace" font-size="10.5" font-weight="700" fill="#E2E8F0">OOM / Time</text>
    <text x="50" y="156" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#78350F">OUT_OF_MEMORY -&gt; raise --mem or use scratch.</text>
    <text x="50" y="178" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#78350F">TIMEOUT -&gt; extend --time or shard with array.</text>
  </g>
  <g filter="url(#card-shadow)">
    <rect x="492" y="98" width="432" height="106" rx="10" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.6"/>
    <path d="M 492 108 Q 492 98 502 98 L 914 98 Q 924 98 924 108 L 924 132 L 492 132 Z" fill="#1D4ED8"/>
    <text x="506" y="120" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#FFFFFF">B. Check Storage &amp; Quotas</text>
    <text x="912" y="120" text-anchor="end" font-family="monospace" font-size="10.5" font-weight="700" fill="#E2E8F0">df / quota</text>
    <text x="506" y="156" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#1E3A8A">Home dir full causes cryptic write errors.</text>
    <text x="506" y="178" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#1E3A8A">Confirm inode quota &amp; $SCRATCH mount availability.</text>
  </g>
  <g filter="url(#card-shadow)">
    <rect x="36" y="218" width="432" height="106" rx="10" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.6"/>
    <path d="M 36 228 Q 36 218 46 218 L 458 218 Q 468 218 468 228 L 468 252 L 36 252 Z" fill="#0D9488"/>
    <text x="50" y="240" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#FFFFFF">C. Inspect Environment &amp; Paths</text>
    <text x="456" y="240" text-anchor="end" font-family="monospace" font-size="10.5" font-weight="700" fill="#E2E8F0">which / ldd</text>
    <text x="50" y="276" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#134E4A">Print PATH, CONDA_PREFIX, module list in log.</text>
    <text x="50" y="298" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#134E4A">Verify compute node sees same working directory.</text>
  </g>
  <g filter="url(#card-shadow)">
    <rect x="492" y="218" width="432" height="106" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
    <path d="M 492 228 Q 492 218 502 218 L 914 218 Q 924 218 924 228 L 924 252 L 492 252 Z" fill="#0F172A"/>
    <text x="506" y="240" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#FFFFFF">D. Minimal Repro Support Ticket</text>
    <text x="912" y="240" text-anchor="end" font-family="monospace" font-size="10.5" font-weight="700" fill="#E2E8F0">Escalation</text>
    <text x="506" y="276" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#334155">Include Job ID, exact sbatch script, host node,</text>
    <text x="506" y="298" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#334155">full error log snippet &amp; exact paths checked.</text>
  </g>
  <line x1="468" y1="151" x2="486" y2="151" stroke="#2563EB" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <line x1="468" y1="271" x2="486" y2="271" stroke="#2563EB" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <rect x="36" y="342" width="888" height="96" rx="10" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5"/>
  <text x="56" y="370" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13.5" font-weight="700" fill="#1E3A8A">Fast Rule: Attach the Exact Job ID, Script Path, and Unedited Error Tail</text>
  <text x="56" y="396" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#1E40AF">- Cluster administrators cannot debug vague messages like &#x27;my R script crashed&#x27;; include sacct -j &lt;ID&gt; --format=... and the last 20 lines of .err.</text>
</svg>
