<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-label="Slurm job state lifecycle showing when squeue, scontrol, sacct, and seff apply across pending, running, and terminal job states">
  <title>Slurm Job States and Where Each Command Looks</title>
  <defs>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
    <filter id="card-shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="960" height="440" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="36" y="40" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#0F172A">Slurm Job States and Where Each Command Looks</text>
  <text x="36" y="64" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#475569">Jobs leave squeue after completion; use sacct and seff for final exit codes and step MaxRSS memory usage</text>

  <!-- Active queue bracket -->
  <rect x="36" y="88" width="528" height="32" rx="6" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.2"/>
  <text x="300" y="109" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#1E40AF">Visible in squeue and scontrol show job (controller memory)</text>

  <!-- Accounting bracket -->
  <rect x="584" y="88" width="340" height="32" rx="6" fill="#FAF5FF" stroke="#DDD6FE" stroke-width="1.2"/>
  <text x="754" y="109" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#5B21B6">Persisted in sacct and seff (accounting DB)</text>

  <!-- State 1: Submitted / PD -->
  <g filter="url(#card-shadow)">
    <rect x="36" y="138" width="156" height="148" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
    <path d="M 36 148 Q 36 138 46 138 L 182 138 Q 192 138 192 148 L 192 172 L 36 172 Z" fill="#1D4ED8"/>
    <text x="48" y="160" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#FFFFFF">PD (Pending)</text>
    <text x="48" y="194" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#334155">Queued by sbatch</text>
    <text x="48" y="214" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#334155">Waiting for slot:</text>
    <text x="48" y="234" font-family="monospace" font-size="11" fill="#1E40AF">(Resources)</text>
    <text x="48" y="252" font-family="monospace" font-size="11" fill="#1E40AF">(Priority)</text>
    <text x="48" y="272" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#64748B">Logs may not exist yet</text>
  </g>

  <line x1="192" y1="212" x2="218" y2="212" stroke="#2563EB" stroke-width="2.2" marker-end="url(#arr-blue)"/>

  <!-- State 2: R (Running) -->
  <g filter="url(#card-shadow)">
    <rect x="222" y="138" width="156" height="148" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
    <path d="M 222 148 Q 222 138 232 138 L 368 138 Q 378 138 378 148 L 378 172 L 222 172 Z" fill="#0D9488"/>
    <text x="234" y="160" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#FFFFFF">R (Running)</text>
    <text x="234" y="194" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#334155">On compute node</text>
    <text x="234" y="214" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#334155">Writes .out / .err</text>
    <text x="234" y="236" font-family="monospace" font-size="11" fill="#0F766E">squeue --me</text>
    <text x="234" y="254" font-family="monospace" font-size="11" fill="#0F766E">scontrol show job</text>
    <text x="234" y="272" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#64748B">Stop with scancel ID</text>
  </g>

  <line x1="378" y1="212" x2="404" y2="212" stroke="#2563EB" stroke-width="2.2" marker-end="url(#arr-blue)"/>

  <!-- State 3: CG (Completing) -->
  <g filter="url(#card-shadow)">
    <rect x="408" y="138" width="156" height="148" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
    <path d="M 408 148 Q 408 138 418 138 L 554 138 Q 564 138 564 148 L 564 172 L 408 172 Z" fill="#475569"/>
    <text x="420" y="160" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#FFFFFF">CG (Completing)</text>
    <text x="420" y="194" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#334155">Main command ended</text>
    <text x="420" y="214" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#334155">Flushing output and</text>
    <text x="420" y="232" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#334155">closing node steps</text>
    <text x="420" y="256" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#64748B">Brief state before</text>
    <text x="420" y="272" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#64748B">leaving squeue</text>
  </g>

  <!-- Branch arrows to terminal states -->
  <line x1="564" y1="176" x2="604" y2="176" stroke="#2563EB" stroke-width="2.2" marker-end="url(#arr-blue)"/>
  <line x1="564" y1="246" x2="604" y2="246" stroke="#DC2626" stroke-width="2.2" marker-end="url(#arr-red)"/>

  <!-- Terminal Success: CD -->
  <g filter="url(#card-shadow)">
    <rect x="608" y="138" width="316" height="72" rx="10" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.6"/>
    <text x="624" y="162" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#166534">CD / COMPLETED (ExitCode 0:0)</text>
    <text x="624" y="182" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#14532D">Verify outputs exist and check .batch MaxRSS</text>
    <text x="624" y="199" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#14532D">to right-size future memory requests</text>
  </g>

  <!-- Terminal Failures: F / OOM / TO / CA -->
  <g filter="url(#card-shadow)">
    <rect x="608" y="220" width="316" height="96" rx="10" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.6"/>
    <text x="624" y="244" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#991B1B">Terminal Non-Success States</text>
    <text x="624" y="264" font-family="monospace" font-size="11" fill="#7F1D1D">F (FAILED, e.g. 1:0 or 127:0): check .err log</text>
    <text x="624" y="282" font-family="monospace" font-size="11" fill="#7F1D1D">OOM (OUT_OF_MEMORY, 0:125): raise --mem</text>
    <text x="624" y="300" font-family="monospace" font-size="11" fill="#7F1D1D">TO (TIMEOUT) / CA (CANCELLED): raise --time</text>
  </g>

  <!-- Bottom note on sacct step rows -->
  <rect x="36" y="334" width="888" height="78" rx="10" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.5"/>
  <text x="56" y="360" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#92400E">Reading sacct rows correctly</text>
  <text x="56" y="381" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#78350F">The parent row (JOB_ID) holds overall State, ExitCode, and ReqMem; the step row (JOB_ID.batch) holds peak RAM (MaxRSS).</text>
  <text x="56" y="400" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#78350F">ExitCode is exit_status:signal (0:0 means clean exit with no signal; 0:125 or 0:9 means cgroup OOM or SIGKILL termination).</text>
</svg>