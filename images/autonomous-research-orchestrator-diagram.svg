<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="auto" role="img" aria-label="Bounded RNA-seq Count-Matrix QC and CPM Workflow">
  <defs>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1000" height="320" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Step 1: Input -->
  <g transform="translate(40, 40)" filter="url(#cardShadow)">
    <rect width="160" height="240" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="160" height="38" rx="12" fill="#f1f5f9"/>
    <text x="80" y="24" fill="#1e293b" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">1. RAW INPUT</text>
    <circle cx="80" cy="90" r="28" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="80" y="96" fill="#1d4ed8" font-family="ui-monospace, monospace" font-size="18" font-weight="700" text-anchor="middle">M×N</text>
    <text x="80" y="150" fill="#334155" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Count Matrix</text>
    <text x="80" y="172" fill="#64748b" font-family="Inter, -apple-system, sans-serif" font-size="11" text-anchor="middle">Gene × Sample</text>
    <text x="80" y="190" fill="#64748b" font-family="Inter, -apple-system, sans-serif" font-size="11" text-anchor="middle">Raw integer counts</text>
    <rect x="20" y="215" width="120" height="20" rx="4" fill="#e2e8f0"/>
    <text x="80" y="229" fill="#475569" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">R / Python Fixture</text>
  </g>

  <!-- Arrow 1-2 -->
  <path d="M 205 160 L 230 160" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="230,155 238,160 230,165" fill="#94a3b8"/>

  <!-- Step 2: Quality Filtering -->
  <g transform="translate(242, 40)" filter="url(#cardShadow)">
    <rect width="160" height="240" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="160" height="38" rx="12" fill="#eff6ff"/>
    <text x="80" y="24" fill="#1d4ed8" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">2. BOUNDED QC</text>
    <circle cx="80" cy="90" r="28" fill="#f0fdf4" stroke="#10b981" stroke-width="2"/>
    <path d="M 70 90 L 77 97 L 92 82" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="80" y="150" fill="#334155" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Deterministic QC</text>
    <text x="80" y="172" fill="#64748b" font-family="Inter, -apple-system, sans-serif" font-size="11" text-anchor="middle">Library size filter</text>
    <text x="80" y="190" fill="#64748b" font-family="Inter, -apple-system, sans-serif" font-size="11" text-anchor="middle">Min gene expression</text>
    <rect x="20" y="215" width="120" height="20" rx="4" fill="#dcfce7"/>
    <text x="80" y="229" fill="#166534" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">Zero AI Drift</text>
  </g>

  <!-- Arrow 2-3 -->
  <path d="M 407 160 L 432 160" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="432,155 440,160 432,165" fill="#94a3b8"/>

  <!-- Step 3: CPM Normalization -->
  <g transform="translate(444, 40)" filter="url(#cardShadow)">
    <rect width="160" height="240" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="160" height="38" rx="12" fill="#f5f3ff"/>
    <text x="80" y="24" fill="#6d28d9" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">3. CPM SCALING</text>
    <circle cx="80" cy="90" r="28" fill="#faf5ff" stroke="#8b5cf6" stroke-width="2"/>
    <text x="80" y="96" fill="#7c3aed" font-family="ui-monospace, monospace" font-size="16" font-weight="700" text-anchor="middle">10⁶</text>
    <text x="80" y="150" fill="#334155" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Normalization</text>
    <text x="80" y="172" fill="#64748b" font-family="Inter, -apple-system, sans-serif" font-size="11" text-anchor="middle">Depth scaling</text>
    <text x="80" y="190" fill="#64748b" font-family="Inter, -apple-system, sans-serif" font-size="11" text-anchor="middle">log2(CPM + 1)</text>
    <rect x="20" y="215" width="120" height="20" rx="4" fill="#ede9fe"/>
    <text x="80" y="229" fill="#5b21b6" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">Reproducible Seed</text>
  </g>

  <!-- Arrow 3-4 -->
  <path d="M 609 160 L 634 160" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="634,155 642,160 634,165" fill="#94a3b8"/>

  <!-- Step 4: Provenance -->
  <g transform="translate(646, 40)" filter="url(#cardShadow)">
    <rect width="160" height="240" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="160" height="38" rx="12" fill="#fffbeb"/>
    <text x="80" y="24" fill="#b45309" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">4. PROVENANCE</text>
    <circle cx="80" cy="90" r="28" fill="#fefce8" stroke="#f59e0b" stroke-width="2"/>
    <path d="M 68 84 L 92 84 M 68 90 L 92 90 M 68 96 L 82 96" stroke="#d97706" stroke-width="2.5" stroke-linecap="round"/>
    <text x="80" y="150" fill="#334155" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Audit Ledger</text>
    <text x="80" y="172" fill="#64748b" font-family="Inter, -apple-system, sans-serif" font-size="11" text-anchor="middle">SHA-256 checksums</text>
    <text x="80" y="190" fill="#64748b" font-family="Inter, -apple-system, sans-serif" font-size="11" text-anchor="middle">Execution metrics</text>
    <rect x="20" y="215" width="120" height="20" rx="4" fill="#fef3c7"/>
    <text x="80" y="229" fill="#92400e" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">JSON Run Record</text>
  </g>

  <!-- Arrow 4-5 -->
  <path d="M 811 160 L 836 160" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="836,155 844,160 836,165" fill="#94a3b8"/>

  <!-- Step 5: Human Review -->
  <g transform="translate(848, 40)" filter="url(#cardShadow)">
    <rect width="112" height="240" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="112" height="38" rx="12" fill="#ecfdf5"/>
    <text x="56" y="24" fill="#047857" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">5. REVIEW</text>
    <circle cx="56" cy="90" r="24" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
    <circle cx="56" cy="85" r="7" fill="#047857"/>
    <path d="M 44 100 C 44 94 49 93 56 93 C 63 93 68 94 68 100" fill="#047857"/>
    <text x="56" y="150" fill="#334155" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Signoff</text>
    <text x="56" y="172" fill="#64748b" font-family="Inter, -apple-system, sans-serif" font-size="11" text-anchor="middle">Biologist gate</text>
    <text x="56" y="190" fill="#64748b" font-family="Inter, -apple-system, sans-serif" font-size="11" text-anchor="middle">Quality pass</text>
    <rect x="12" y="215" width="88" height="20" rx="4" fill="#a7f3d0"/>
    <text x="56" y="229" fill="#065f46" font-family="ui-monospace, monospace" font-size="9" text-anchor="middle">Validated</text>
  </g>
</svg>
