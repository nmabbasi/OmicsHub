<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" role="img" aria-label="Automating FASTQ &amp; GTF Summaries With Strict Bash Scripts">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
    <filter id="card-shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="960" height="460" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="36" y="42" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#0F172A">Automating FASTQ &amp; GTF Summaries With Strict Bash Scripts</text>
  <text x="36" y="66" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#475569">Replace ad-hoc one-liners with reusable Bash scripts guarded by set -euo pipefail and 4-line FASTQ validation</text>
  <g filter="url(#card-shadow)">
    <rect x="36" y="98" width="272" height="184" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
    <path d="M 36 108 Q 36 98 46 98 L 298 98 Q 308 98 308 108 L 308 132 L 36 132 Z" fill="#0F172A"/>
    <text x="50" y="120" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#FFFFFF">1. Strict Script Header</text>
    <text x="296" y="120" text-anchor="end" font-family="monospace" font-size="10.5" font-weight="700" fill="#E2E8F0">set -euo</text>
    <text x="50" y="156" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#334155">#!/usr/bin/env bash</text>
    <text x="50" y="178" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#334155">set -euo pipefail</text>
    <text x="50" y="200" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#334155">Validate CLI arguments</text>
    <text x="50" y="222" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#334155">Check tool binaries first</text>
  </g>
  <line x1="308" y1="190" x2="340" y2="190" stroke="#2563EB" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <g filter="url(#card-shadow)">
    <rect x="344" y="98" width="272" height="184" rx="10" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.6"/>
    <path d="M 344 108 Q 344 98 354 98 L 606 98 Q 616 98 616 108 L 616 132 L 344 132 Z" fill="#1D4ED8"/>
    <text x="358" y="120" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#FFFFFF">2. Modulo-4 FASTQ Audit</text>
    <text x="604" y="120" text-anchor="end" font-family="monospace" font-size="10.5" font-weight="700" fill="#E2E8F0">Validate</text>
    <text x="358" y="156" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#1E3A8A">Run gzip -t integrity check</text>
    <text x="358" y="178" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#1E3A8A">Enforce FASTQ lines % 4 == 0</text>
    <text x="358" y="200" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#1E3A8A">Verify @ read ID &amp; + lines</text>
    <text x="358" y="222" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#1E3A8A">Keep logs on stderr</text>
  </g>
  <line x1="616" y1="190" x2="648" y2="190" stroke="#2563EB" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <g filter="url(#card-shadow)">
    <rect x="652" y="98" width="272" height="184" rx="10" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.6"/>
    <path d="M 652 108 Q 652 98 662 98 L 914 98 Q 924 98 924 108 L 924 132 L 652 132 Z" fill="#0D9488"/>
    <text x="666" y="120" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#FFFFFF">3. Reproducible TSV Table</text>
    <text x="912" y="120" text-anchor="end" font-family="monospace" font-size="10.5" font-weight="700" fill="#E2E8F0">Output</text>
    <text x="666" y="156" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#134E4A">Print clean TSV header row</text>
    <text x="666" y="178" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#134E4A">Summarize reads &amp; bases</text>
    <text x="666" y="200" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#134E4A">Tabulate GTF feature types</text>
    <text x="666" y="222" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#134E4A">Exit non-zero if corrupt</text>
  </g>
  <rect x="36" y="306" width="888" height="122" rx="10" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5"/>
  <text x="56" y="334" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13.5" font-weight="700" fill="#1E3A8A">Why Check Line Count % 4 and Gzip Integrity Separately</text>
  <text x="56" y="360" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#1E40AF">- A truncated .fastq.gz archive fails gzip CRC checks (gzip -t), while an uncompressed hand-edited file can lose one line silently.</text>
  <text x="56" y="384" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#1E40AF">- Always exit non-zero (exit 1) on malformed inputs instead of printing partial summary counts downstream.</text>
</svg>
