<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-label="Bounded RNA-seq QC &amp; CPM Workflow With Human Audit Gates">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
    <filter id="card-shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="960" height="440" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="36" y="42" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#0F172A">Bounded RNA-seq QC &amp; CPM Workflow With Human Audit Gates</text>
  <text x="36" y="66" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#475569">Deterministic contract validation separates automated matrix processing from biological sign-off</text>
<g filter="url(#card-shadow)">
  <rect x="36" y="100" width="195" height="165" rx="10" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.6"/>
  <path d="M 36 110 Q 36 100 46 100 L 221 100 Q 231 100 231 110 L 231 134 L 36 134 Z" fill="#1D4ED8"/>
  <text x="50" y="122" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">1. Input Contract</text>
  <text x="217" y="122" text-anchor="end" font-family="monospace" font-size="11" font-weight="700" fill="#E2E8F0">R / Py</text>
  <text x="50" y="158" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" fill="#334155">counts.csv &amp; meta.csv</text>
  <text x="50" y="180" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" fill="#334155">Check non-negative ints</text>
  <text x="50" y="202" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" fill="#334155">Verify sample ID alignment</text>
  <text x="50" y="224" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" fill="#334155">Fail fast on NAs/dups</text>
</g><line x1="231" y1="182" x2="268" y2="182" stroke="#2563EB" stroke-width="2.2" marker-end="url(#arrow-blue)"/><g filter="url(#card-shadow)">
  <rect x="272" y="100" width="195" height="165" rx="10" fill="#FFFFFF" stroke="#5EEAD4" stroke-width="1.6"/>
  <path d="M 272 110 Q 272 100 282 100 L 457 100 Q 467 100 467 110 L 467 134 L 272 134 Z" fill="#0D9488"/>
  <text x="286" y="122" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">2. Deterministic QC</text>
  <text x="453" y="122" text-anchor="end" font-family="monospace" font-size="11" font-weight="700" fill="#E2E8F0">Local</text>
  <text x="286" y="158" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" fill="#334155">Library sizes &amp; detected genes</text>
  <text x="286" y="180" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" fill="#334155">Flag low-depth outliers</text>
  <text x="286" y="202" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" fill="#334155">Compute log2(CPM + 1)</text>
  <text x="286" y="224" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" fill="#334155">Zero hidden side effects</text>
</g><line x1="467" y1="182" x2="504" y2="182" stroke="#2563EB" stroke-width="2.2" marker-end="url(#arrow-blue)"/><g filter="url(#card-shadow)">
  <rect x="508" y="100" width="195" height="165" rx="10" fill="#FFFFFF" stroke="#FCD34D" stroke-width="1.6"/>
  <path d="M 508 110 Q 508 100 518 100 L 693 100 Q 703 100 703 110 L 703 134 L 508 134 Z" fill="#D97706"/>
  <text x="522" y="122" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">3. Provenance Log</text>
  <text x="689" y="122" text-anchor="end" font-family="monospace" font-size="11" font-weight="700" fill="#E2E8F0">JSON</text>
  <text x="522" y="158" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" fill="#334155">Record SHA-256 checksums</text>
  <text x="522" y="180" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" fill="#334155">Capture R / Python versions</text>
  <text x="522" y="202" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" fill="#334155">Save QC summary JSON</text>
  <text x="522" y="224" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" fill="#334155">Export reproducible tables</text>
</g><line x1="703" y1="182" x2="740" y2="182" stroke="#2563EB" stroke-width="2.2" marker-end="url(#arrow-blue)"/><g filter="url(#card-shadow)">
  <rect x="744" y="100" width="180" height="165" rx="10" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1.6"/>
  <path d="M 744 110 Q 744 100 754 100 L 914 100 Q 924 100 924 110 L 924 134 L 744 134 Z" fill="#E11D48"/>
  <text x="758" y="122" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">4. Human Review</text>
  <text x="910" y="122" text-anchor="end" font-family="monospace" font-size="11" font-weight="700" fill="#E2E8F0">Gate</text>
  <text x="758" y="158" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" fill="#334155">Inspect PCA &amp; outliers</text>
  <text x="758" y="180" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" fill="#334155">Check batch vs group</text>
  <text x="758" y="202" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" fill="#334155">Approve before DE model</text>
  <text x="758" y="224" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" fill="#334155">Document excluded samples</text>
</g><rect x="36" y="300" width="888" height="106" rx="10" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.4"/><text x="56" y="328" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#1E3A8A">Boundary Rule: Automated Helpers Never Rewrite Raw Inputs or Overrule Study Design</text><text x="56" y="354" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#1E40AF">- Keep optional AI summarization decoupled behind explicit schemas so core QC/CPM results are 100% deterministic.</text><text x="56" y="378" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#1E40AF">- Log exact command arguments and input digests so every threshold decision remains auditable after publication.</text>
</svg>
