# Deploy the static academy to GitHub Pages.
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: https://theomicshub.com
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify generated homepage stylesheet
        run: |
          npm ci --prefix tools --no-audit --no-fund
          npm run --prefix tools build:home-css
          git diff --exit-code -- home-page.min.css
          rm -rf tools/node_modules

      - name: Validate tutorial retention, links, SEO, and accessibility markup
        run: |
          python3 tests/validate_tutorials.py
          python3 -m unittest discover -s tests -v

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
