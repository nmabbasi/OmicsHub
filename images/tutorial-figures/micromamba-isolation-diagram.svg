<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-label="Isolated Per-Project Environments With Micromamba &amp; Bioconda">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
    <filter id="card-shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="960" height="440" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="36" y="42" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#0F172A">Isolated Per-Project Environments With Micromamba &amp; Bioconda</text>
  <text x="36" y="66" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#475569">Prevent conflicting R, Python, Boost, or HTSlib shared libraries by isolating each pipeline in its own environment</text>
<g filter="url(#card-shadow)">
  <rect x="36" y="98" width="250" height="210" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.6"/>
  <path d="M 36 108 Q 36 98 46 98 L 276 98 Q 286 98 286 108 L 286 132 L 36 132 Z" fill="#475569"/>
  <text x="50" y="120" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Host OS (Keep Clean)</text>
  <text x="272" y="120" text-anchor="end" font-family="monospace" font-size="11" font-weight="700" fill="#E2E8F0">Base</text>
  <text x="50" y="156" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" fill="#334155">System Python /usr/bin</text>
  <text x="50" y="178" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" fill="#334155">Minimal base utilities</text>
  <text x="50" y="200" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" fill="#334155">micromamba single binary</text>
  <text x="50" y="222" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" fill="#334155">Do NOT install bioinformatics</text>
  <text x="50" y="244" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" fill="#334155">packages globally into base</text>
  <text x="50" y="266" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" fill="#334155">Avoids broken apt / C++ ABI</text>
</g><line x1="286" y1="150" x2="342" y2="132" stroke="#2563EB" stroke-width="2.2" marker-end="url(#arrow-blue)"/><line x1="286" y1="203" x2="342" y2="228" stroke="#2563EB" stroke-width="2.2" marker-end="url(#arrow-blue)"/><line x1="286" y1="256" x2="342" y2="326" stroke="#2563EB" stroke-width="2.2" marker-end="url(#arrow-blue)"/><g filter="url(#card-shadow)">
  <rect x="346" y="86" width="290" height="92" rx="10" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.6"/>
  <path d="M 346 96 Q 346 86 356 86 L 626 86 Q 636 86 636 96 L 636 120 L 346 120 Z" fill="#1D4ED8"/>
  <text x="360" y="108" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Env 1: env_qc_fastq</text>
  <text x="622" y="108" text-anchor="end" font-family="monospace" font-size="11" font-weight="700" fill="#E2E8F0">Fast</text>
  <text x="360" y="144" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" fill="#334155">fastqc, multiqc, fastp (Python 3.11)</text>
</g><g filter="url(#card-shadow)">
  <rect x="346" y="192" width="290" height="92" rx="10" fill="#FFFFFF" stroke="#5EEAD4" stroke-width="1.6"/>
  <path d="M 346 202 Q 346 192 356 192 L 626 192 Q 636 192 636 202 L 636 226 L 346 226 Z" fill="#0D9488"/>
  <text x="360" y="214" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Env 2: env_scrna_r44</text>
  <text x="622" y="214" text-anchor="end" font-family="monospace" font-size="11" font-weight="700" fill="#E2E8F0">R 4.4</text>
  <text x="360" y="250" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" fill="#334155">r-base=4.4, r-seurat, bioconductor-*</text>
</g><g filter="url(#card-shadow)">
  <rect x="346" y="298" width="290" height="92" rx="10" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.6"/>
  <path d="M 346 308 Q 346 298 356 298 L 626 298 Q 636 298 636 308 L 636 332 L 346 332 Z" fill="#7C3AED"/>
  <text x="360" y="320" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Env 3: env_align_dna</text>
  <text x="622" y="320" text-anchor="end" font-family="monospace" font-size="11" font-weight="700" fill="#E2E8F0">WES</text>
  <text x="360" y="356" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" fill="#334155">bwa-mem2, samtools, bcftools, gatk4</text>
</g><line x1="636" y1="132" x2="686" y2="210" stroke="#475569" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#arrow)"/><line x1="636" y1="238" x2="686" y2="238" stroke="#475569" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#arrow)"/><line x1="636" y1="344" x2="686" y2="266" stroke="#475569" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#arrow)"/><g filter="url(#card-shadow)">
  <rect x="690" y="140" width="234" height="200" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
  <path d="M 690 150 Q 690 140 700 140 L 914 140 Q 924 140 924 150 L 924 174 L 690 174 Z" fill="#0F172A"/>
  <text x="704" y="162" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Export Exact Lockfile</text>
  <text x="910" y="162" text-anchor="end" font-family="monospace" font-size="11" font-weight="700" fill="#E2E8F0">Repro</text>
  <text x="704" y="198" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" fill="#334155">Channel order (strict):</text>
  <text x="704" y="220" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" fill="#334155">1. conda-forge</text>
  <text x="704" y="242" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" fill="#334155">2. bioconda</text>
  <text x="704" y="264" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" fill="#334155"></text>
  <text x="704" y="286" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" fill="#334155">micromamba env export</text>
  <text x="704" y="308" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" fill="#334155">  --from-history &gt; env.yml</text>
</g>
</svg>
