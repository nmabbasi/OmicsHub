<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" role="img" aria-label="Anatomy of a Specification-Backed Prompt for Single-Cell Code">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
    <filter id="card-shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="960" height="460" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="36" y="42" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#0F172A">Anatomy of a Specification-Backed Prompt for Single-Cell Code</text>
  <text x="36" y="66" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#475569">Contrast vague one-liners with explicit data contracts, assay assumptions, statistical design, and output paths</text>
  <g filter="url(#card-shadow)">
    <rect x="36" y="98" width="270" height="330" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
    <path d="M 36 108 Q 36 98 46 98 L 296 98 Q 306 98 306 108 L 306 132 L 36 132 Z" fill="#0F172A"/>
    <text x="50" y="120" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#FFFFFF">Specification Pillars</text>
    <text x="294" y="120" text-anchor="end" font-family="monospace" font-size="10.5" font-weight="700" fill="#E2E8F0">Contract</text>
    <text x="50" y="156" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#334155">Why weak prompts fail:</text>
    <text x="50" y="178" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#334155">- Guess MT- vs mt- pattern</text>
    <text x="50" y="200" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#334155">- Mix RNA &amp; SCT assays</text>
    <text x="50" y="222" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#334155">- Conflate cells &amp; donors</text>
    <text x="50" y="244" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#334155">- Drop random seeds</text>
    <text x="50" y="266" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#334155"></text>
    <text x="50" y="288" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#334155">Include in every prompt:</text>
    <text x="50" y="310" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#334155">1. Exact object paths</text>
    <text x="50" y="332" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#334155">2. Explicit covariates</text>
    <text x="50" y="354" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#334155">3. Expected CSV/PNG out</text>
    <text x="50" y="376" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#334155">4. Stop-on-error checks</text>
  </g>
  <g filter="url(#card-shadow)">
    <rect x="348" y="98" width="576" height="102" rx="10" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.6"/>
    <path d="M 348 108 Q 348 98 358 98 L 914 98 Q 924 98 924 108 L 924 132 L 348 132 Z" fill="#1D4ED8"/>
    <text x="362" y="120" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#FFFFFF">Input &amp; Assay Contract</text>
    <text x="912" y="120" text-anchor="end" font-family="monospace" font-size="10.5" font-weight="700" fill="#E2E8F0">Object</text>
    <text x="362" y="156" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#1E3A8A">Declare path (./data/seurat_obj.rds), DefaultAssay, raw counts vs log-normalized layer,</text>
    <text x="362" y="178" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#1E3A8A">species prefix (human MT- vs mouse mt-), and required metadata columns (donor_id).</text>
  </g>
  <line x1="306" y1="160" x2="342" y2="149" stroke="#2563EB" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <g filter="url(#card-shadow)">
    <rect x="348" y="212" width="576" height="102" rx="10" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.6"/>
    <path d="M 348 222 Q 348 212 358 212 L 914 212 Q 924 212 924 222 L 924 246 L 348 246 Z" fill="#0D9488"/>
    <text x="362" y="234" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#FFFFFF">Statistical &amp; Clustering Choices</text>
    <text x="912" y="234" text-anchor="end" font-family="monospace" font-size="10.5" font-weight="700" fill="#E2E8F0">Stats</text>
    <text x="362" y="270" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#134E4A">Pin fixed random seeds, PC count, resolution parameter, and biological replication unit</text>
    <text x="362" y="292" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#134E4A">(donor-level pseudobulk DE rather than treating individual cells as independent).</text>
  </g>
  <line x1="306" y1="255" x2="342" y2="263" stroke="#2563EB" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <g filter="url(#card-shadow)">
    <rect x="348" y="326" width="576" height="102" rx="10" fill="#FAF5FF" stroke="#D8B4FE" stroke-width="1.6"/>
    <path d="M 348 336 Q 348 326 358 326 L 914 326 Q 924 326 924 336 L 924 360 L 348 360 Z" fill="#7C3AED"/>
    <text x="362" y="348" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#FFFFFF">Outputs &amp; Sanity Assertions</text>
    <text x="912" y="348" text-anchor="end" font-family="monospace" font-size="10.5" font-weight="700" fill="#E2E8F0">Audit</text>
    <text x="362" y="384" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#4C1D95">Require explicit assertions (dim, Assay presence, finite UMAP coords), saved PNG/CSV</text>
    <text x="362" y="406" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#4C1D95">paths under ./results/, and sessionInfo() / package versions logged to disk.</text>
  </g>
  <line x1="306" y1="350" x2="342" y2="377" stroke="#2563EB" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
</svg>
