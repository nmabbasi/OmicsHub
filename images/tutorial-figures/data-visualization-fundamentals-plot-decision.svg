<svg xmlns="http://www.w3.org/2000/svg" width="920" height="460" viewBox="0 0 920 460" role="img" aria-labelledby="dvf-title dvf-desc">
  <title id="dvf-title">Choosing and checking five core omics visualization plots</title>
  <desc id="dvf-desc">Decision table diagram mapping five bioinformatics plot types (QC distributions, PCA, UMAP, heatmaps, and volcano plots) to the question each answers, the required input and preprocessing, and the main interpretation trap to avoid.</desc>
  <rect width="920" height="460" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- Header -->
  <text x="28" y="36" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0F172A">Which plot answers your question? Match question, input contract, and trap</text>
  <text x="28" y="56" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#475569">Select the plot after checking sample IDs, units, and transformations; treat visual patterns as diagnostic cues.</text>

  <!-- Column headers -->
  <rect x="24" y="72" width="164" height="32" rx="6" fill="#123B5D"/>
  <rect x="196" y="72" width="224" height="32" rx="6" fill="#123B5D"/>
  <rect x="428" y="72" width="232" height="32" rx="6" fill="#123B5D"/>
  <rect x="668" y="72" width="228" height="32" rx="6" fill="#123B5D"/>
  <text x="36" y="92" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">1. Plot type</text>
  <text x="208" y="92" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">2. Question answered</text>
  <text x="440" y="92" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">3. Input &amp; preprocessing</text>
  <text x="680" y="92" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">4. Main trap to avoid</text>

  <!-- Row 1: QC distributions -->
  <rect x="24" y="114" width="164" height="58" rx="8" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.2"/>
  <rect x="196" y="114" width="224" height="58" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="428" y="114" width="232" height="58" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="668" y="114" width="228" height="58" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="36" y="138" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#0C4A6E">QC distributions</text>
  <text x="36" y="156" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="11.5" fill="#0369A1">Boxplot + points, histogram</text>
  <text x="208" y="138" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12" fill="#1E293B">Are read depth and %MT</text>
  <text x="208" y="156" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12" fill="#1E293B">comparable across batches?</text>
  <text x="440" y="138" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12" fill="#1E293B">1 row per sample; verify units</text>
  <text x="440" y="156" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12" fill="#1E293B">(e.g. 5.2 vs 0.052) and NAs.</text>
  <text x="680" y="138" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12" fill="#78350F">Boxplots hide small N;</text>
  <text x="680" y="156" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12" fill="#78350F">always overlay raw points.</text>

  <!-- Row 2: PCA -->
  <rect x="24" y="182" width="164" height="58" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.2"/>
  <rect x="196" y="182" width="224" height="58" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="428" y="182" width="232" height="58" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="668" y="182" width="228" height="58" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="36" y="206" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#064E3B">PCA scatter</text>
  <text x="36" y="224" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="11.5" fill="#047857">Linear global projection</text>
  <text x="208" y="206" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12" fill="#1E293B">Which factors drive the</text>
  <text x="208" y="224" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12" fill="#1E293B">largest sample variation?</text>
  <text x="440" y="206" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12" fill="#1E293B">Normalized log2-CPM, filtered</text>
  <text x="440" y="224" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12" fill="#1E293B">genes, centered &amp; scaled.</text>
  <text x="680" y="206" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12" fill="#78350F">Z-scoring amplifies noisy low</text>
  <text x="680" y="224" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12" fill="#78350F">genes; check batch balance.</text>

  <!-- Row 3: UMAP -->
  <rect x="24" y="250" width="164" height="58" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.2"/>
  <rect x="196" y="250" width="224" height="58" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="428" y="250" width="232" height="58" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="668" y="250" width="228" height="58" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="36" y="274" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#4C1D95">UMAP embedding</text>
  <text x="36" y="292" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="11.5" fill="#6D28D9">Non-linear neighborhoods</text>
  <text x="208" y="274" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12" fill="#1E293B">What local cell neighborhoods</text>
  <text x="208" y="292" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12" fill="#1E293B">form in large datasets?</text>
  <text x="440" y="274" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12" fill="#1E293B">Top PCA scores (not 2 PCs),</text>
  <text x="440" y="292" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12" fill="#1E293B">n_neighbors &lt; N, fixed seed.</text>
  <text x="680" y="274" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12" fill="#78350F">Skip on small bulk cohorts;</text>
  <text x="680" y="292" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12" fill="#78350F">gaps are not true distances.</text>

  <!-- Row 4: Heatmap -->
  <rect x="24" y="318" width="164" height="58" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.2"/>
  <rect x="196" y="318" width="224" height="58" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="428" y="318" width="232" height="58" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="668" y="318" width="228" height="58" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="36" y="342" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#1E3A8A">Clustered heatmap</text>
  <text x="36" y="360" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1D4ED8">Color matrix + linkage</text>
  <text x="208" y="342" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12" fill="#1E293B">How do selected genes vary</text>
  <text x="208" y="360" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12" fill="#1E293B">across samples together?</text>
  <text x="440" y="342" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12" fill="#1E293B">Top variable genes, drop</text>
  <text x="440" y="360" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12" fill="#1E293B">constant rows, row z-score.</text>
  <text x="680" y="342" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12" fill="#78350F">Row z-scores hide absolute</text>
  <text x="680" y="360" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12" fill="#78350F">expression; order varies.</text>

  <!-- Row 5: Volcano -->
  <rect x="24" y="386" width="164" height="58" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.2"/>
  <rect x="196" y="386" width="224" height="58" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="428" y="386" width="232" height="58" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="668" y="386" width="228" height="58" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="36" y="410" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#7F1D1D">Volcano plot</text>
  <text x="36" y="428" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="11.5" fill="#B91C1C">Effect size vs -log10(padj)</text>
  <text x="208" y="410" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12" fill="#1E293B">Which tested genes show large</text>
  <text x="208" y="428" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12" fill="#1E293B">effect and low adjusted p?</text>
  <text x="440" y="410" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12" fill="#1E293B">DE model output (shrunken</text>
  <text x="440" y="428" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12" fill="#1E293B">LFC + BH-adjusted padj).</text>
  <text x="680" y="410" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12" fill="#78350F">Log NA rows; floor padj=0</text>
  <text x="680" y="428" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12" fill="#78350F">underflow before -log10.</text>
</svg>
