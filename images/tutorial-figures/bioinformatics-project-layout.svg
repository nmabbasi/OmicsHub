<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" role="img" aria-label="Standardized Reproducible Bioinformatics Project Directory Tree">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
    <filter id="card-shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="960" height="460" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="36" y="42" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#0F172A">Standardized Reproducible Bioinformatics Project Directory Tree</text>
  <text x="36" y="66" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#475569">Keep immutable raw inputs read-only, separate code from large intermediates, and ship self-contained reports</text>
<g filter="url(#card-shadow)">
  <rect x="36" y="98" width="270" height="320" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
  <path d="M 36 108 Q 36 98 46 98 L 296 98 Q 306 98 306 108 L 306 132 L 36 132 Z" fill="#0F172A"/>
  <text x="50" y="120" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Project Tree (~omics_study/)</text>
  <text x="292" y="120" text-anchor="end" font-family="monospace" font-size="11" font-weight="700" fill="#E2E8F0">Git Root</text>
  <text x="50" y="156" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" fill="#334155">README.md         # Study &amp; run guide</text>
  <text x="50" y="178" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" fill="#334155">envs/env.yml      # Software lockfile</text>
  <text x="50" y="200" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" fill="#334155">config/samples.csv# Sample metadata</text>
  <text x="50" y="222" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" fill="#334155">data/raw/         # chmod a-w FASTQ!</text>
  <text x="50" y="244" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" fill="#334155">data/reference/   # GTF &amp; genome idx</text>
  <text x="50" y="266" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" fill="#334155">scripts/          # Versioned .R/.py</text>
  <text x="50" y="288" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" fill="#334155">work/             # Scratch (deletable)</text>
  <text x="50" y="310" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" fill="#334155">results/tables/   # DE &amp; QC outputs</text>
  <text x="50" y="332" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" fill="#334155">results/figures/  # Vector PDF + PNG</text>
  <text x="50" y="354" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" fill="#334155">logs/             # Stdout + checksums</text>
</g><line x1="306" y1="190" x2="354" y2="152" stroke="#2563EB" stroke-width="2.2" marker-end="url(#arrow-blue)"/><line x1="306" y1="250" x2="354" y2="255" stroke="#2563EB" stroke-width="2.2" marker-end="url(#arrow-blue)"/><line x1="306" y1="325" x2="354" y2="358" stroke="#2563EB" stroke-width="2.2" marker-end="url(#arrow-blue)"/><g filter="url(#card-shadow)">
  <rect x="358" y="98" width="566" height="98" rx="10" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.6"/>
  <path d="M 358 108 Q 358 98 368 98 L 914 98 Q 924 98 924 108 L 924 132 L 358 132 Z" fill="#1D4ED8"/>
  <text x="372" y="120" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Track in Git (Tiny, Auditable Source)</text>
  <text x="910" y="120" text-anchor="end" font-family="monospace" font-size="11" font-weight="700" fill="#E2E8F0">&lt; 5 MB</text>
  <text x="372" y="156" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" fill="#334155">Commit scripts/, config/samples.csv, envs/env.yml, README.md, and Workflowfile.</text>
  <text x="372" y="178" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" fill="#334155">Never commit multi-gigabyte FASTQs, BAMs, or temporary cache directories to Git.</text>
</g><g filter="url(#card-shadow)">
  <rect x="358" y="210" width="566" height="98" rx="10" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.6"/>
  <path d="M 358 220 Q 358 210 368 210 L 914 210 Q 924 210 924 220 L 924 244 L 358 244 Z" fill="#D97706"/>
  <text x="372" y="232" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Protect as Read-Only + SHA-256 (Raw Inputs)</text>
  <text x="910" y="232" text-anchor="end" font-family="monospace" font-size="11" font-weight="700" fill="#E2E8F0">Immutable</text>
  <text x="372" y="268" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" fill="#334155">Set raw sequencing reads read-only (`chmod -R a-w data/raw`) and verify MD5/SHA-256 on arrival.</text>
  <text x="372" y="290" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" fill="#334155">Downstream scripts read `data/raw/` strictly via relative paths from project root.</text>
</g><g filter="url(#card-shadow)">
  <rect x="358" y="322" width="566" height="98" rx="10" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.6"/>
  <path d="M 358 332 Q 358 322 368 322 L 914 322 Q 924 322 924 332 L 924 356 L 358 356 Z" fill="#0D9488"/>
  <text x="372" y="344" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Regenerable &amp; Deliverable Outputs (results/ &amp; work/)</text>
  <text x="910" y="344" text-anchor="end" font-family="monospace" font-size="11" font-weight="700" fill="#E2E8F0">Outputs</text>
  <text x="372" y="380" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" fill="#334155">`work/` holds temporary alignments and can be rebuilt from `scripts/` + `data/raw/` at any time.</text>
  <text x="372" y="402" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" fill="#334155">`results/` stores final versioned tables, figures, and sessionInfo/logs for collaborators.</text>
</g>
</svg>
