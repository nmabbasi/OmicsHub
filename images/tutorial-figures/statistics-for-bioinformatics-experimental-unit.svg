<svg xmlns="http://www.w3.org/2000/svg" width="840" height="380" viewBox="0 0 840 380" role="img" aria-labelledby="svg-exp-unit-title svg-exp-unit-desc">
  <title id="svg-exp-unit-title">Biological replicates versus technical repeats (avoiding pseudoreplication)</title>
  <desc id="svg-exp-unit-desc">Two-panel diagram comparing pseudoreplication, where 4 technical qPCR wells from each of 3 mice per group are wrongly tested as n = 12 independent samples, against summarizing technical wells to 1 value per mouse so Welch's t-test compares n = 3 biological replicates per group.</desc>
  <defs>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect width="840" height="380" fill="#ffffff" rx="12"/>

  <text x="420" y="28" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Biological Replicates vs. Technical Repeats</text>
  <text x="420" y="48" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12" fill="#475569">Count n at the level where the treatment was independently assigned (here, each mouse)</text>

  <!-- Left Panel: Pseudoreplication -->
  <rect x="20" y="64" width="385" height="296" rx="10" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/>
  <rect x="20" y="64" width="385" height="34" rx="10" fill="#fef2f2"/>
  <rect x="20" y="88" width="385" height="10" fill="#fef2f2"/>
  <line x1="20" y1="98" x2="405" y2="98" stroke="#fecaca" stroke-width="1"/>
  <text x="212" y="86" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#991b1b">Wrong: Pseudoreplication (n = 12 per group)</text>

  <text x="36" y="118" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#1e3a8a">Control (3 mice, 4 technical wells each)</text>
  <g font-family="Inter, system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#1e3a8a" text-anchor="middle">
    <rect x="36" y="125" width="106" height="44" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="89" y="140">Mouse C1</text>
    <circle cx="59" cy="156" r="5" fill="#2563eb"/><circle cx="79" cy="156" r="5" fill="#2563eb"/><circle cx="99" cy="156" r="5" fill="#2563eb"/><circle cx="119" cy="156" r="5" fill="#2563eb"/>

    <rect x="154" y="125" width="106" height="44" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="207" y="140">Mouse C2</text>
    <circle cx="177" cy="156" r="5" fill="#2563eb"/><circle cx="197" cy="156" r="5" fill="#2563eb"/><circle cx="217" cy="156" r="5" fill="#2563eb"/><circle cx="237" cy="156" r="5" fill="#2563eb"/>

    <rect x="272" y="125" width="106" height="44" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="325" y="140">Mouse C3</text>
    <circle cx="295" cy="156" r="5" fill="#2563eb"/><circle cx="315" cy="156" r="5" fill="#2563eb"/><circle cx="335" cy="156" r="5" fill="#2563eb"/><circle cx="355" cy="156" r="5" fill="#2563eb"/>
  </g>

  <text x="36" y="191" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#115e59">Treated (3 mice, 4 technical wells each)</text>
  <g font-family="Inter, system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#115e59" text-anchor="middle">
    <rect x="36" y="198" width="106" height="44" rx="6" fill="#f0fdfa" stroke="#5eead4"/>
    <text x="89" y="213">Mouse T1</text>
    <circle cx="59" cy="229" r="5" fill="#0d9488"/><circle cx="79" cy="229" r="5" fill="#0d9488"/><circle cx="99" cy="229" r="5" fill="#0d9488"/><circle cx="119" cy="229" r="5" fill="#0d9488"/>

    <rect x="154" y="198" width="106" height="44" rx="6" fill="#f0fdfa" stroke="#5eead4"/>
    <text x="207" y="213">Mouse T2</text>
    <circle cx="177" cy="229" r="5" fill="#0d9488"/><circle cx="197" cy="229" r="5" fill="#0d9488"/><circle cx="217" cy="229" r="5" fill="#0d9488"/><circle cx="237" cy="229" r="5" fill="#0d9488"/>

    <rect x="272" y="198" width="106" height="44" rx="6" fill="#f0fdfa" stroke="#5eead4"/>
    <text x="325" y="213">Mouse T3</text>
    <circle cx="295" cy="229" r="5" fill="#0d9488"/><circle cx="315" cy="229" r="5" fill="#0d9488"/><circle cx="335" cy="229" r="5" fill="#0d9488"/><circle cx="355" cy="229" r="5" fill="#0d9488"/>
  </g>

  <g stroke="#dc2626" stroke-width="1.3" marker-end="url(#arrow-red)">
    <line x1="65" y1="244" x2="80" y2="270"/>
    <line x1="89" y1="244" x2="104" y2="270"/>
    <line x1="113" y1="244" x2="128" y2="270"/>
    <line x1="183" y1="244" x2="195" y2="270"/>
    <line x1="207" y1="244" x2="212" y2="270"/>
    <line x1="231" y1="244" x2="229" y2="270"/>
    <line x1="301" y1="244" x2="292" y2="270"/>
    <line x1="325" y1="244" x2="315" y2="270"/>
    <line x1="349" y1="244" x2="338" y2="270"/>
  </g>

  <rect x="36" y="274" width="353" height="72" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="212" y="295" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#991b1b">All 24 wells fed directly into t-test (n = 12 vs. 12)</text>
  <text x="212" y="314" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="11.2" fill="#7f1d1d">Treats within-mouse technical noise as biological evidence.</text>
  <text x="212" y="332" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="11.2" fill="#7f1d1d">Artificially shrinks SE and inflates false-positive rates.</text>

  <!-- Right Panel: Proper Experimental Unit -->
  <rect x="435" y="64" width="385" height="296" rx="10" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
  <rect x="435" y="64" width="385" height="34" rx="10" fill="#f0fdf4"/>
  <rect x="435" y="88" width="385" height="10" fill="#f0fdf4"/>
  <line x1="435" y1="98" x2="820" y2="98" stroke="#bbf7d0" stroke-width="1"/>
  <text x="627" y="86" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#166534">Right: Biological-Unit Summary (n = 3 per group)</text>

  <text x="451" y="118" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#1e3a8a">Control (summarize 4 wells to 1 mouse value)</text>
  <g font-family="Inter, system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#1e3a8a" text-anchor="middle">
    <rect x="451" y="125" width="106" height="44" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="504" y="140">Mouse C1</text>
    <circle cx="471" cy="156" r="4" fill="#93c5fd"/><circle cx="486" cy="156" r="4" fill="#93c5fd"/><circle cx="501" cy="156" r="4" fill="#93c5fd"/><circle cx="516" cy="156" r="4" fill="#93c5fd"/>
    <rect x="527" y="149" width="22" height="14" rx="3" fill="#1d4ed8"/><text x="538" y="159" font-size="9" fill="#ffffff">avg</text>

    <rect x="569" y="125" width="106" height="44" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="622" y="140">Mouse C2</text>
    <circle cx="589" cy="156" r="4" fill="#93c5fd"/><circle cx="604" cy="156" r="4" fill="#93c5fd"/><circle cx="619" cy="156" r="4" fill="#93c5fd"/><circle cx="634" cy="156" r="4" fill="#93c5fd"/>
    <rect x="645" y="149" width="22" height="14" rx="3" fill="#1d4ed8"/><text x="656" y="159" font-size="9" fill="#ffffff">avg</text>

    <rect x="687" y="125" width="106" height="44" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="740" y="140">Mouse C3</text>
    <circle cx="707" cy="156" r="4" fill="#93c5fd"/><circle cx="722" cy="156" r="4" fill="#93c5fd"/><circle cx="737" cy="156" r="4" fill="#93c5fd"/><circle cx="752" cy="156" r="4" fill="#93c5fd"/>
    <rect x="763" y="149" width="22" height="14" rx="3" fill="#1d4ed8"/><text x="774" y="159" font-size="9" fill="#ffffff">avg</text>
  </g>

  <text x="451" y="191" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#115e59">Treated (summarize 4 wells to 1 mouse value)</text>
  <g font-family="Inter, system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#115e59" text-anchor="middle">
    <rect x="451" y="198" width="106" height="44" rx="6" fill="#f0fdfa" stroke="#5eead4"/>
    <text x="504" y="213">Mouse T1</text>
    <circle cx="471" cy="229" r="4" fill="#5eead4"/><circle cx="486" cy="229" r="4" fill="#5eead4"/><circle cx="501" cy="229" r="4" fill="#5eead4"/><circle cx="516" cy="229" r="4" fill="#5eead4"/>
    <rect x="527" y="222" width="22" height="14" rx="3" fill="#0f766e"/><text x="538" y="232" font-size="9" fill="#ffffff">avg</text>

    <rect x="569" y="198" width="106" height="44" rx="6" fill="#f0fdfa" stroke="#5eead4"/>
    <text x="622" y="213">Mouse T2</text>
    <circle cx="589" cy="229" r="4" fill="#5eead4"/><circle cx="604" cy="229" r="4" fill="#5eead4"/><circle cx="619" cy="229" r="4" fill="#5eead4"/><circle cx="634" cy="229" r="4" fill="#5eead4"/>
    <rect x="645" y="222" width="22" height="14" rx="3" fill="#0f766e"/><text x="656" y="232" font-size="9" fill="#ffffff">avg</text>

    <rect x="687" y="198" width="106" height="44" rx="6" fill="#f0fdfa" stroke="#5eead4"/>
    <text x="740" y="213">Mouse T3</text>
    <circle cx="707" cy="229" r="4" fill="#5eead4"/><circle cx="722" cy="229" r="4" fill="#5eead4"/><circle cx="737" cy="229" r="4" fill="#5eead4"/><circle cx="752" cy="229" r="4" fill="#5eead4"/>
    <rect x="763" y="222" width="22" height="14" rx="3" fill="#0f766e"/><text x="774" y="232" font-size="9" fill="#ffffff">avg</text>
  </g>

  <g stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrow-green)">
    <line x1="504" y1="244" x2="520" y2="270"/>
    <line x1="622" y1="244" x2="622" y2="270"/>
    <line x1="740" y1="244" x2="724" y2="270"/>
  </g>

  <rect x="451" y="274" width="353" height="72" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="627" y="295" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#166534">1 value per mouse into Welch test (n = 3 vs. 3)</text>
  <text x="627" y="314" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="11.2" fill="#14532d">Or fit a mixed-effects model with mouse ID as a random effect.</text>
  <text x="627" y="332" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="11.2" fill="#14532d">CIs and p-values reflect genuine mouse-to-mouse variation.</text>
</svg>
