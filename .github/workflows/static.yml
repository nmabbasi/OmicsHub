# Deploy the static academy to GitHub Pages.
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: https://theomicshub.com
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      # This inline API call is intentionally used instead of actions/deploy-pages.
      # It avoids the external action archive download that GitHub is currently rate-limiting.
      - name: Deploy artifact with GitHub Pages API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          artifacts_json="$(curl --fail-with-body --retry 5 --retry-all-errors --retry-delay 4 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts")"
          artifact_id="$(jq -r '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | sort_by(.id) | last | .id // empty' <<<"${artifacts_json}")"

          if [[ -z "${artifact_id}" ]]; then
            echo "Unable to locate the github-pages artifact for this workflow run." >&2
            exit 1
          fi

          oidc_json="$(curl --fail-with-body --retry 5 --retry-all-errors --retry-delay 4 \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}")"
          oidc_token="$(jq -r '.value // empty' <<<"${oidc_json}")"

          if [[ -z "${oidc_token}" ]]; then
            echo "Unable to obtain the GitHub Actions OIDC token." >&2
            exit 1
          fi

          payload="$(jq -nc \
            --argjson artifact_id "${artifact_id}" \
            --arg pages_build_version "${GITHUB_SHA}" \
            --arg oidc_token "${oidc_token}" \
            '{artifact_id: $artifact_id, pages_build_version: $pages_build_version, oidc_token: $oidc_token}')"

          deployment_json="$(curl --fail-with-body --retry 5 --retry-all-errors --retry-delay 4 \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pages/deployments" \
            --data "${payload}")"
          deployment_id="$(jq -r '.id // empty' <<<"${deployment_json}")"
          page_url="$(jq -r '.page_url // "https://theomicshub.com"' <<<"${deployment_json}")"
          echo "page_url=${page_url}" >> "${GITHUB_OUTPUT}"

          if [[ -z "${deployment_id}" ]]; then
            echo "GitHub Pages did not return a deployment identifier." >&2
            exit 1
          fi

          for attempt in {1..60}; do
            status_json="$(curl --silent --show-error --fail-with-body --retry 3 --retry-all-errors --retry-delay 3 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pages/deployments/${deployment_id}")" || {
                echo "Deployment status request failed on attempt ${attempt}; retrying." >&2
                sleep 5
                continue
              }
            status="$(jq -r '.status // "unknown_status"' <<<"${status_json}")"
            echo "GitHub Pages deployment status: ${status}"

            case "${status}" in
              succeed)
                exit 0
                ;;
              deployment_failed|deployment_perms_error|deployment_content_failed|deployment_cancelled|deployment_lost)
                echo "GitHub Pages reported a final deployment failure: ${status}" >&2
                exit 1
                ;;
              *)
                sleep 5
                ;;
            esac
          done

          echo "Timed out while waiting for the GitHub Pages deployment." >&2
          exit 1
