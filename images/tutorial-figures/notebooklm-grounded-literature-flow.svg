<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" role="img" aria-label="Source-Grounded Literature Synthesis With Explicit Citation Trails">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
    <filter id="card-shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="960" height="460" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="36" y="42" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#0F172A">Source-Grounded Literature Synthesis With Explicit Citation Trails</text>
  <text x="36" y="66" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#475569">Organize peer-reviewed PDFs into focused notebooks, demand passage-level quotes, and flag unresolved contradictions</text>
  <g filter="url(#card-shadow)">
    <rect x="36" y="98" width="204" height="178" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
    <path d="M 36 108 Q 36 98 46 98 L 230 98 Q 240 98 240 108 L 240 132 L 36 132 Z" fill="#0F172A"/>
    <text x="50" y="120" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#FFFFFF">1. Clean Corpus</text>
    <text x="228" y="120" text-anchor="end" font-family="monospace" font-size="10.5" font-weight="700" fill="#E2E8F0">Sources</text>
    <text x="50" y="156" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#334155">Published PDFs only</text>
    <text x="50" y="178" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#334155">No PHI/private drafts</text>
    <text x="50" y="200" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#334155">One topic per notebook</text>
    <text x="50" y="222" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#334155">Include supp tables</text>
  </g>
  <line x1="240" y1="187" x2="260" y2="187" stroke="#2563EB" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <g filter="url(#card-shadow)">
    <rect x="264" y="98" width="204" height="178" rx="10" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.6"/>
    <path d="M 264 108 Q 264 98 274 98 L 458 98 Q 468 98 468 108 L 468 132 L 264 132 Z" fill="#1D4ED8"/>
    <text x="278" y="120" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#FFFFFF">2. Cited Queries</text>
    <text x="456" y="120" text-anchor="end" font-family="monospace" font-size="10.5" font-weight="700" fill="#E2E8F0">Ask</text>
    <text x="278" y="156" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#1E3A8A">Demand page/sec refs</text>
    <text x="278" y="178" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#1E3A8A">Extract exact methods</text>
    <text x="278" y="200" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#1E3A8A">Note paper conflicts</text>
    <text x="278" y="222" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#1E3A8A">Check what is omitted</text>
  </g>
  <line x1="468" y1="187" x2="488" y2="187" stroke="#2563EB" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <g filter="url(#card-shadow)">
    <rect x="492" y="98" width="204" height="178" rx="10" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.6"/>
    <path d="M 492 108 Q 492 98 502 98 L 686 98 Q 696 98 696 108 L 696 132 L 492 132 Z" fill="#0D9488"/>
    <text x="506" y="120" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#FFFFFF">3. Audit Matrix</text>
    <text x="684" y="120" text-anchor="end" font-family="monospace" font-size="10.5" font-weight="700" fill="#E2E8F0">Verify</text>
    <text x="506" y="156" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#134E4A">Click citation anchors</text>
    <text x="506" y="178" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#134E4A">Verify stats + sample n</text>
    <text x="506" y="200" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#134E4A">Keep dissenting rows</text>
    <text x="506" y="222" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#134E4A">Confirm control arms</text>
  </g>
  <line x1="696" y1="187" x2="716" y2="187" stroke="#2563EB" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <g filter="url(#card-shadow)">
    <rect x="720" y="98" width="204" height="178" rx="10" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.6"/>
    <path d="M 720 108 Q 720 98 730 98 L 914 98 Q 924 98 924 108 L 924 132 L 720 132 Z" fill="#D97706"/>
    <text x="734" y="120" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#FFFFFF">4. Gate Claims</text>
    <text x="912" y="120" text-anchor="end" font-family="monospace" font-size="10.5" font-weight="700" fill="#E2E8F0">Mark gaps</text>
    <text x="734" y="156" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#78350F">Flag unsupported leaps</text>
    <text x="734" y="178" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#78350F">Mark gaps unresolved</text>
    <text x="734" y="200" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#78350F">Check DOI/PMID directly</text>
    <text x="734" y="222" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#78350F">Write prose yourself</text>
  </g>
  <rect x="36" y="304" width="888" height="124" rx="10" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.5"/>
  <text x="56" y="332" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13.5" font-weight="700" fill="#92400E">Grounded Synthesis Does Not Replace Reading Critical Figures &amp; Methods Yourself</text>
  <text x="56" y="358" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#78350F">- Always click back into the primary PDF to verify statistical tests, sample sizes, reagent doses, and supplementary caveats before citing.</text>
</svg>
