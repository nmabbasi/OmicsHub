<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Bioinformatics alpha helix and omics analysis</title>
  <desc id="desc">A luminous multicolor DNA alpha helix surrounded by subtle bioinformatics data motifs.</desc>
  <defs>
