<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" role="img" aria-label="Bounded State-Machine Architecture for AI Workflows">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
    <filter id="card-shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="960" height="460" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="36" y="42" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#0F172A">Bounded State-Machine Architecture for AI Workflows</text>
  <text x="36" y="66" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#475569">Enforce explicit transitions, deterministic validators, retry caps, and human sign-off instead of open-ended loops</text>
  <g filter="url(#card-shadow)">
    <rect x="36" y="98" width="204" height="178" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
    <path d="M 36 108 Q 36 98 46 98 L 230 98 Q 240 98 240 108 L 240 132 L 36 132 Z" fill="#0F172A"/>
    <text x="50" y="120" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#FFFFFF">1. Define State</text>
    <text x="228" y="120" text-anchor="end" font-family="monospace" font-size="10.5" font-weight="700" fill="#E2E8F0">Typed</text>
    <text x="50" y="156" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#334155">Fixed schema inputs</text>
    <text x="50" y="178" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#334155">Allowlisted file paths</text>
    <text x="50" y="200" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#334155">Track run ID + seed</text>
    <text x="50" y="222" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#334155">Max retry_limit = 3</text>
  </g>
  <line x1="240" y1="187" x2="260" y2="187" stroke="#2563EB" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <g filter="url(#card-shadow)">
    <rect x="264" y="98" width="204" height="178" rx="10" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.6"/>
    <path d="M 264 108 Q 264 98 274 98 L 458 98 Q 468 98 468 108 L 468 132 L 264 132 Z" fill="#1D4ED8"/>
    <text x="278" y="120" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#FFFFFF">2. Draft Packet</text>
    <text x="456" y="120" text-anchor="end" font-family="monospace" font-size="10.5" font-weight="700" fill="#E2E8F0">Step</text>
    <text x="278" y="156" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#1E3A8A">Bounded prompt context</text>
    <text x="278" y="178" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#1E3A8A">No secrets or donor PHI</text>
    <text x="278" y="200" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#1E3A8A">Strict JSON schema</text>
    <text x="278" y="222" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#1E3A8A">Hash raw response</text>
  </g>
  <line x1="468" y1="187" x2="488" y2="187" stroke="#2563EB" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <g filter="url(#card-shadow)">
    <rect x="492" y="98" width="204" height="178" rx="10" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.6"/>
    <path d="M 492 108 Q 492 98 502 98 L 686 98 Q 696 98 696 108 L 696 132 L 492 132 Z" fill="#0D9488"/>
    <text x="506" y="120" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#FFFFFF">3. Hard Gate</text>
    <text x="684" y="120" text-anchor="end" font-family="monospace" font-size="10.5" font-weight="700" fill="#E2E8F0">Verify</text>
    <text x="506" y="156" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#134E4A">Exact parser + schema</text>
    <text x="506" y="178" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#134E4A">Verify accession IDs</text>
    <text x="506" y="200" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#134E4A">Reject guessed fields</text>
    <text x="506" y="222" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#134E4A">Pass -&gt; review_ready</text>
  </g>
  <line x1="696" y1="187" x2="716" y2="187" stroke="#2563EB" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <g filter="url(#card-shadow)">
    <rect x="720" y="98" width="204" height="178" rx="10" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.6"/>
    <path d="M 720 108 Q 720 98 730 98 L 914 98 Q 924 98 924 108 L 924 132 L 720 132 Z" fill="#D97706"/>
    <text x="734" y="120" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#FFFFFF">4. Retry / Halt</text>
    <text x="912" y="120" text-anchor="end" font-family="monospace" font-size="10.5" font-weight="700" fill="#E2E8F0">Safe</text>
    <text x="734" y="156" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#78350F">Retry if &lt; retry_limit</text>
    <text x="734" y="178" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#78350F">Return terse diff log</text>
    <text x="734" y="200" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#78350F">Hit cap -&gt; halt cleanly</text>
    <text x="734" y="222" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#78350F">Human approval gate</text>
  </g>
  <rect x="36" y="304" width="888" height="124" rx="10" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5"/>
  <text x="56" y="332" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13.5" font-weight="700" fill="#1E3A8A">Why Bounded Loops Beat Unchecked Agents in Bioinformatics</text>
  <text x="56" y="358" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#1E40AF">- Deterministic Python or R checks catch invalid coordinates, swapped IDs, or broken formats before files reach collaborators.</text>
  <text x="56" y="382" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#1E40AF">- Explicit retry caps prevent silent token burn and stop workflows cleanly into human review whenever evidence is ambiguous.</text>
</svg>
