<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" role="img" aria-label="Python Building Blocks for Streaming Genomics &amp; Count Tables">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
    <filter id="card-shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="960" height="460" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="36" y="42" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#0F172A">Python Building Blocks for Streaming Genomics &amp; Count Tables</text>
  <text x="36" y="66" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#475569">Progress from sequence string slicing and GC functions to memory-safe FASTA generators and CLI TSV pipelines</text>
  <g filter="url(#card-shadow)">
    <rect x="36" y="98" width="270" height="330" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
    <path d="M 36 108 Q 36 98 46 98 L 296 98 Q 306 98 306 108 L 306 132 L 36 132 Z" fill="#0F172A"/>
    <text x="50" y="120" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#FFFFFF">Core Python Patterns</text>
    <text x="294" y="120" text-anchor="end" font-family="monospace" font-size="10.5" font-weight="700" fill="#E2E8F0">Py &gt;= 3.10</text>
    <text x="50" y="156" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#334155">Key data structures:</text>
    <text x="50" y="178" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#334155">- Strings: seq[::-1] rev-comp</text>
    <text x="50" y="200" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#334155">- Sets: valid {A,C,G,T,N}</text>
    <text x="50" y="222" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#334155">- Dicts: O(1) k-mer counts</text>
    <text x="50" y="244" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#334155">- yield: constant-RAM I/O</text>
    <text x="50" y="266" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#334155"></text>
    <text x="50" y="288" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#334155">Production CLI habits:</text>
    <text x="50" y="310" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#334155">- argparse for file paths</text>
    <text x="50" y="332" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#334155">- Handle empty/N bases</text>
    <text x="50" y="354" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#334155">- Pin env requirements</text>
    <text x="50" y="376" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#334155">- Unit test edge cases</text>
  </g>
  <g filter="url(#card-shadow)">
    <rect x="348" y="98" width="576" height="102" rx="10" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.6"/>
    <path d="M 348 108 Q 348 98 358 98 L 914 98 Q 924 98 924 108 L 924 132 L 348 132 Z" fill="#1D4ED8"/>
    <text x="362" y="120" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#FFFFFF">Avoid the GC-Denominator &amp; Case Trap</text>
    <text x="912" y="120" text-anchor="end" font-family="monospace" font-size="10.5" font-weight="700" fill="#E2E8F0">Step 1-2</text>
    <text x="362" y="156" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#1E3A8A">Normalize case (.upper()) and separate ambiguous N bases explicitly before dividing</text>
    <text x="362" y="178" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#1E3A8A">(G + C) by called bases vs total length, so masked regions never skew GC%.</text>
  </g>
  <line x1="306" y1="160" x2="342" y2="149" stroke="#2563EB" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <g filter="url(#card-shadow)">
    <rect x="348" y="212" width="576" height="102" rx="10" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.6"/>
    <path d="M 348 222 Q 348 212 358 212 L 914 212 Q 924 212 924 222 L 924 246 L 348 246 Z" fill="#0D9488"/>
    <text x="362" y="234" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#FFFFFF">Stream Large FASTA Files With yield Generators</text>
    <text x="912" y="234" text-anchor="end" font-family="monospace" font-size="10.5" font-weight="700" fill="#E2E8F0">Step 3-4</text>
    <text x="362" y="270" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#134E4A">Loading a 3 GB human genome into one list crashes laptops; yielding (header, seq)</text>
    <text x="362" y="292" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#134E4A">one record at a time scans millions of contigs or reads cleanly in constant RAM.</text>
  </g>
  <line x1="306" y1="255" x2="342" y2="263" stroke="#2563EB" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <g filter="url(#card-shadow)">
    <rect x="348" y="326" width="576" height="102" rx="10" fill="#FAF5FF" stroke="#D8B4FE" stroke-width="1.6"/>
    <path d="M 348 336 Q 348 326 358 326 L 914 326 Q 924 326 924 336 L 924 360 L 348 360 Z" fill="#7C3AED"/>
    <text x="362" y="348" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#FFFFFF">Export Clean CSV Summaries via Isolated Environments</text>
    <text x="912" y="348" text-anchor="end" font-family="monospace" font-size="10.5" font-weight="700" fill="#E2E8F0">Step 5</text>
    <text x="362" y="384" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#4C1D95">Run scripts/compute_fasta_stats.py inside a pinned venv/micromamba environment so</text>
    <text x="362" y="406" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#4C1D95">CSV metrics (length, GC%, top k-mers) reproduce identically on local and HPC nodes.</text>
  </g>
  <line x1="306" y1="350" x2="342" y2="377" stroke="#2563EB" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
</svg>
