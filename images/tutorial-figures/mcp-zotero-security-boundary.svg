<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" role="img" aria-label="Security Boundaries &amp; Read-Only Evaluation for a Zotero MCP Server">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
    <filter id="card-shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="960" height="460" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="36" y="42" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#0F172A">Security Boundaries &amp; Read-Only Evaluation for a Zotero MCP Server</text>
  <text x="36" y="66" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#475569">Treat third-party MCP servers as privileged local code: inspect source, block writes, and audit read queries</text>
  <g filter="url(#card-shadow)">
    <rect x="36" y="98" width="272" height="184" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
    <path d="M 36 108 Q 36 98 46 98 L 298 98 Q 308 98 308 108 L 308 132 L 36 132 Z" fill="#0F172A"/>
    <text x="50" y="120" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#FFFFFF">1. AI Host Client</text>
    <text x="296" y="120" text-anchor="end" font-family="monospace" font-size="10.5" font-weight="700" fill="#E2E8F0">Caller</text>
    <text x="50" y="156" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#334155">Sends structured tool call</text>
    <text x="50" y="178" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#334155">Applies per-tool approval</text>
    <text x="50" y="200" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#334155">Never auto-run write tools</text>
    <text x="50" y="222" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#334155">Keep secrets outside prompt</text>
  </g>
  <line x1="308" y1="190" x2="340" y2="190" stroke="#2563EB" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <g filter="url(#card-shadow)">
    <rect x="344" y="98" width="272" height="184" rx="10" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.6"/>
    <path d="M 344 108 Q 344 98 354 98 L 606 98 Q 616 98 616 108 L 616 132 L 344 132 Z" fill="#D97706"/>
    <text x="358" y="120" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#FFFFFF">2. Audit Boundary</text>
    <text x="604" y="120" text-anchor="end" font-family="monospace" font-size="10.5" font-weight="700" fill="#E2E8F0">Inspector</text>
    <text x="358" y="156" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#78350F">Verify open-source repo</text>
    <text x="358" y="178" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#78350F">Review write/delete tools</text>
    <text x="358" y="200" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#78350F">Block unintended egress</text>
    <text x="358" y="222" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#78350F">Pin exact commit or tag</text>
  </g>
  <line x1="616" y1="190" x2="648" y2="190" stroke="#2563EB" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <g filter="url(#card-shadow)">
    <rect x="652" y="98" width="272" height="184" rx="10" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.6"/>
    <path d="M 652 108 Q 652 98 662 98 L 914 98 Q 924 98 924 108 L 924 132 L 652 132 Z" fill="#0D9488"/>
    <text x="666" y="120" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#FFFFFF">3. Disposable / RO DB</text>
    <text x="912" y="120" text-anchor="end" font-family="monospace" font-size="10.5" font-weight="700" fill="#E2E8F0">Zotero</text>
    <text x="666" y="156" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#134E4A">Test on throwaway copy!</text>
    <text x="666" y="178" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#134E4A">Mount SQLite read-only</text>
    <text x="666" y="200" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#134E4A">Block tag/item mutation</text>
    <text x="666" y="222" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#134E4A">Verify citation key hits</text>
  </g>
  <rect x="36" y="306" width="888" height="122" rx="10" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.5"/>
  <text x="56" y="334" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13.5" font-weight="700" fill="#92400E">Never Connect an Unaudited Third-Party Server to Your Primary Manuscript Library</text>
  <text x="56" y="360" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#78350F">- Read-only flags inside a prompt do not stop a buggy or malicious tool binary from calling write APIs or reading adjacent dotfiles.</text>
  <text x="56" y="384" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#78350F">- Audit tool schemas directly and copy zotero.sqlite to a temporary test path while evaluating any new server.</text>
</svg>
