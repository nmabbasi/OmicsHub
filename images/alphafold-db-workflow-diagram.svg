<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="auto" role="img" aria-label="AlphaFold DB Structure Retrieval and pLDDT Assessment Workflow">
  <defs>
    <filter id="alphaShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1000" height="320" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Step 1: Query -->
  <g transform="translate(40, 40)" filter="url(#alphaShadow)">
    <rect width="165" height="240" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="165" height="38" rx="12" fill="#f1f5f9"/>
    <text x="82" y="24" fill="#1e293b" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">1. UNIPROT QUERY</text>
    <circle cx="82" cy="90" r="28" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="82" y="96" fill="#1d4ed8" font-family="ui-monospace, monospace" font-size="15" font-weight="700" text-anchor="middle">P04637</text>
    <text x="82" y="150" fill="#334155" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Accession Lookup</text>
    <text x="82" y="172" fill="#64748b" font-family="Inter, -apple-system, sans-serif" font-size="11" text-anchor="middle">Target protein identifier</text>
    <text x="82" y="190" fill="#64748b" font-family="Inter, -apple-system, sans-serif" font-size="11" text-anchor="middle">Isoform verification</text>
    <rect x="20" y="215" width="125" height="20" rx="4" fill="#e2e8f0"/>
    <text x="82" y="229" fill="#475569" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">Input Accession</text>
  </g>

  <!-- Arrow 1-2 -->
  <path d="M 210 160 L 235 160" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="235,155 243,160 235,165" fill="#94a3b8"/>

  <!-- Step 2: API Fetch -->
  <g transform="translate(248, 40)" filter="url(#alphaShadow)">
    <rect width="165" height="240" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="165" height="38" rx="12" fill="#eff6ff"/>
    <text x="82" y="24" fill="#1d4ed8" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">2. ALPHAFOLD API</text>
    <circle cx="82" cy="90" r="28" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/>
    <path d="M 70 82 L 94 82 M 70 90 L 94 90 M 70 98 L 86 98" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round"/>
    <text x="82" y="150" fill="#334155" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">REST Endpoint</text>
    <text x="82" y="172" fill="#64748b" font-family="Inter, -apple-system, sans-serif" font-size="11" text-anchor="middle">Retrieve metadata</text>
    <text x="82" y="190" fill="#64748b" font-family="Inter, -apple-system, sans-serif" font-size="11" text-anchor="middle">Download PDB/mmCIF</text>
    <rect x="20" y="215" width="125" height="20" rx="4" fill="#e0f2fe"/>
    <text x="82" y="229" fill="#0369a1" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">Provenance Hash</text>
  </g>

  <!-- Arrow 2-3 -->
  <path d="M 418 160 L 443 160" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="443,155 451,160 443,165" fill="#94a3b8"/>

  <!-- Step 3: pLDDT Metric -->
  <g transform="translate(456, 40)" filter="url(#alphaShadow)">
    <rect width="250" height="240" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="250" height="38" rx="12" fill="#f8fafc"/>
    <text x="125" y="24" fill="#0f172a" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">3. pLDDT CONFIDENCE TIERS</text>
    
    <!-- Tiers -->
    <g transform="translate(15, 52)">
      <rect width="18" height="18" rx="4" fill="#0053D6"/>
      <text x="26" y="14" fill="#1e293b" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="600">Very High (&gt; 90)</text>
      <text x="145" y="14" fill="#64748b" font-family="Inter, -apple-system, sans-serif" font-size="10">High accuracy backbone</text>
    </g>
    <g transform="translate(15, 80)">
      <rect width="18" height="18" rx="4" fill="#65CBF3"/>
      <text x="26" y="14" fill="#1e293b" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="600">Confident (70–90)</text>
      <text x="145" y="14" fill="#64748b" font-family="Inter, -apple-system, sans-serif" font-size="10">Reliable conformation</text>
    </g>
    <g transform="translate(15, 108)">
      <rect width="18" height="18" rx="4" fill="#FFDB13"/>
      <text x="26" y="14" fill="#1e293b" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="600">Low (50–70)</text>
      <text x="145" y="14" fill="#64748b" font-family="Inter, -apple-system, sans-serif" font-size="10">Flexible loops / caution</text>
    </g>
    <g transform="translate(15, 136)">
      <rect width="18" height="18" rx="4" fill="#FF7D45"/>
      <text x="26" y="14" fill="#1e293b" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="600">Very Low (&lt; 50)</text>
      <text x="145" y="14" fill="#64748b" font-family="Inter, -apple-system, sans-serif" font-size="10">Intrinsically disordered</text>
    </g>
    <rect x="25" y="215" width="200" height="20" rx="4" fill="#f1f5f9"/>
    <text x="125" y="229" fill="#334155" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">Per-Residue B-factor Array</text>
  </g>

  <!-- Arrow 3-4 -->
  <path d="M 711 160 L 736 160" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="736,155 744,160 736,165" fill="#94a3b8"/>

  <!-- Step 4: Validation -->
  <g transform="translate(749, 40)" filter="url(#alphaShadow)">
    <rect width="211" height="240" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="211" height="38" rx="12" fill="#ecfdf5"/>
    <text x="105" y="24" fill="#047857" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">4. VALIDATION</text>
    <circle cx="105" cy="90" r="28" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
    <path d="M 95 90 L 102 97 L 117 82" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round"/>
    <text x="105" y="150" fill="#334155" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Biological Validity</text>
    <text x="105" y="172" fill="#64748b" font-family="Inter, -apple-system, sans-serif" font-size="11" text-anchor="middle">Pocket assessment</text>
    <text x="105" y="190" fill="#64748b" font-family="Inter, -apple-system, sans-serif" font-size="11" text-anchor="middle">PAE interface checking</text>
    <rect x="20" y="215" width="171" height="20" rx="4" fill="#a7f3d0"/>
    <text x="105" y="229" fill="#065f46" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">Decision Gate</text>
  </g>
</svg>
