<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="formats-flow-title">
  <title id="formats-flow-title">How Core Bioinformatics File Formats Connect from Raw Reads to Biological Tables</title>
  <defs>
    <marker id="arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
    <filter id="card-shadow-fmt" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="960" height="400" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="32" y="38" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="19" font-weight="700" fill="#0F172A">From Raw Sequences to Analysis Tables: Core File Formats</text>
  <text x="32" y="60" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" fill="#475569">Each pipeline stage expects a specific format, coordinate system, and matching chromosome names</text>

  <!-- Column 1: Raw & Reference -->
  <g filter="url(#card-shadow-fmt)">
    <rect x="32" y="84" width="262" height="196" rx="10" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.6"/>
    <path d="M 32 94 Q 32 84 42 84 L 284 84 Q 294 84 294 94 L 294 118 L 32 118 Z" fill="#1D4ED8"/>
    <text x="46" y="106" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#FFFFFF">1. Sequences &amp; Reads</text>
    <text x="280" y="106" text-anchor="end" font-family="monospace" font-size="10.5" font-weight="700" fill="#DBEAFE">Input</text>

    <rect x="46" y="132" width="234" height="62" rx="7" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
    <text x="56" y="151" font-family="monospace" font-size="12" font-weight="700" fill="#1E3A8A">FASTA (.fa / .fasta)</text>
    <text x="56" y="169" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.2" fill="#334155">Reference genome or protein seqs</text>
    <text x="56" y="185" font-family="monospace" font-size="10.5" fill="#475569">&gt;sp|P69905|HBA_HUMAN + letters</text>

    <rect x="46" y="204" width="234" height="62" rx="7" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
    <text x="56" y="223" font-family="monospace" font-size="12" font-weight="700" fill="#1E3A8A">FASTQ (.fastq.gz)</text>
    <text x="56" y="241" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.2" fill="#334155">Raw reads + base quality scores</text>
    <text x="56" y="257" font-family="monospace" font-size="10.5" fill="#475569">4 lines/read (Phred+33 ASCII)</text>
  </g>

  <line x1="294" y1="182" x2="334" y2="182" stroke="#2563EB" stroke-width="2.2" marker-end="url(#arrow-flow)"/>

  <!-- Column 2: Mapped Coordinates & Annotations -->
  <g filter="url(#card-shadow-fmt)">
    <rect x="338" y="84" width="282" height="196" rx="10" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1.6"/>
    <path d="M 338 94 Q 338 84 348 84 L 610 84 Q 620 84 620 94 L 620 118 L 338 118 Z" fill="#0D9488"/>
    <text x="352" y="106" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#FFFFFF">2. Alignments &amp; Features</text>
    <text x="606" y="106" text-anchor="end" font-family="monospace" font-size="10.5" font-weight="700" fill="#CCFBF1">Coords</text>

    <rect x="352" y="132" width="254" height="62" rx="7" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1"/>
    <text x="362" y="151" font-family="monospace" font-size="12" font-weight="700" fill="#134E4A">SAM / BAM / CRAM</text>
    <text x="362" y="169" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.2" fill="#334155">Reads mapped to reference build</text>
    <text x="362" y="185" font-family="monospace" font-size="10.5" fill="#475569">1-based SAM pos, CIGAR, MAPQ</text>

    <rect x="352" y="204" width="254" height="62" rx="7" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1"/>
    <text x="362" y="223" font-family="monospace" font-size="12" font-weight="700" fill="#134E4A">GTF/GFF3 vs BED</text>
    <text x="362" y="241" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.2" fill="#334155">GTF/GFF3: 1-based closed [start, end]</text>
    <text x="362" y="257" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.2" fill="#334155">BED: 0-based half-open [start, end)</text>
  </g>

  <line x1="620" y1="182" x2="660" y2="182" stroke="#2563EB" stroke-width="2.2" marker-end="url(#arrow-flow)"/>

  <!-- Column 3: Analysis Tables -->
  <g filter="url(#card-shadow-fmt)">
    <rect x="664" y="84" width="264" height="196" rx="10" fill="#FFFFFF" stroke="#D8B4FE" stroke-width="1.6"/>
    <path d="M 664 94 Q 664 84 674 84 L 918 84 Q 928 84 928 94 L 928 118 L 664 118 Z" fill="#7C3AED"/>
    <text x="678" y="106" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#FFFFFF">3. Analysis Outputs</text>
    <text x="914" y="106" text-anchor="end" font-family="monospace" font-size="10.5" font-weight="700" fill="#EDE9FE">Tables</text>

    <rect x="678" y="130" width="236" height="42" rx="6" fill="#FAF5FF" stroke="#E9D5FF" stroke-width="1"/>
    <text x="688" y="147" font-family="monospace" font-size="11.5" font-weight="700" fill="#4C1D95">Count Matrix (.tsv / .mtx)</text>
    <text x="688" y="163" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.8" fill="#475569">Genes x samples or cells for R/Python</text>

    <rect x="678" y="179" width="236" height="42" rx="6" fill="#FAF5FF" stroke="#E9D5FF" stroke-width="1"/>
    <text x="688" y="196" font-family="monospace" font-size="11.5" font-weight="700" fill="#4C1D95">VCF (.vcf.gz)</text>
    <text x="688" y="212" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.8" fill="#475569">1-based variants: CHROM, POS, REF, ALT</text>

    <rect x="678" y="228" width="236" height="42" rx="6" fill="#FAF5FF" stroke="#E9D5FF" stroke-width="1"/>
    <text x="688" y="245" font-family="monospace" font-size="11.5" font-weight="700" fill="#4C1D95">BLAST TSV (-outfmt 6)</text>
    <text x="688" y="261" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.8" fill="#475569">pident, length, evalue, bitscore, qcovs</text>
  </g>

  <!-- Bottom Compatibility Guard -->
  <rect x="32" y="298" width="896" height="78" rx="10" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="50" y="324" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#78350F">Common Pipeline Trap: Format and Coordinate Mismatches</text>
  <text x="50" y="346" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.8" fill="#92400E">- Check chromosome naming (chr1 vs 1) and genome build (for example, GRCh38 vs GRCh37) before counting reads or calling variants.</text>
  <text x="50" y="364" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.8" fill="#92400E">- Never mix 0-based half-open BED intervals with 1-based closed GTF/VCF coordinates without converting start = start_0 + 1.</text>
</svg>
